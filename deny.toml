# cargo-deny configuration — license / ban / source gates for the public repo.
#
# Usage: `cargo deny check licenses bans sources`
# Wired into `.github/workflows/ci.yml`.

[licenses]
# This repository is MIT OR Apache-2.0. The audit found **zero copyleft
# dependencies** (Cargo.lock is the inventory; vendored/ported code is in THIRD_PARTY.md). Anything not listed here fails the
# gate and forces an explicit decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    # r-efi is triple-licensed (MIT OR Apache-2.0 OR LGPL-2.1-or-later); we use it
    # under MIT/Apache, but the manifest name carries the LGPL option — allow it to
    # avoid a false positive. It is not in the x86_64-linux dependency tree.
    "LGPL-2.1-or-later",
]
# Hard denials: no "just sneak it in".
deny = ["GPL-2.0-only", "GPL-3.0-only", "AGPL-3.0-only", "SSPL-1.0"]

[bans]
multiple-versions = "allow"   # duplicate transitive versions are normal
wildcards = "warn"            # workspace-internal deps are path-only (no version)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
