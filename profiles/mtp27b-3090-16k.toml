# owl 档 `mtp27b-3090-16k`（2026-10-21 MTP 头投机解码接入）
#
# 27B AWQ-INT4 单张 3090 Ti；草稿族 = 检查点自带 MTP 头（不是外部 DFlash2）。
# 预检：
#   ./target/release/server -p profiles/mtp27b-3090-16k.toml --check
# 启动：
#   ./target/release/server -p profiles/mtp27b-3090-16k.toml
#
# 口径：16k 是验证档，先证明 MTP 恒等/启动/接受率；长上下文另开档。

[model]
kind = "awq27b"
name = "qwen3.8-27b"
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
head_quant = "rtn-int4-g32"
quant = "w4a16"

[runtime]
bind = "127.0.0.1:8139"
max_seq = 16384
prefill_chunk = 1024
prefill_tail_merge = 1024

[spec]
# 显式钉 MTP：即使以后同检查点旁边放了 dflash2_dir，也不会切走。
draft = "mtp"
# MTP 单层链，契约上限 3（kv_slots [u32;4]）
depth = 3

[server]
max_concurrency = 1

[pool]
pool_tokens = 16896
gdn_slots = 1
prefix_cache = false
snap_max = 1
host_cache_mb = 0
snap_host_mb = 0
vram_target = 0.99
vram_reserve_mb = 512

[dispatch]
# 主池仍走生产 fp8；MTP 草稿链是独立 F16 池，由 spec.draft 派生。
kv_fp8 = true
verify_fi = true
decode_fi = true
verify_v2 = false
fi_cuda_graph = true
fi_plan_bake = 0
fi_plan_restore = false
gdn_chunked = true

[sampling]
mode = "greedy"
