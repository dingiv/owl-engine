# owl 档 `mtp27b-3090-16k` —— 3090 Ti 单卡 27B AWQ + 检查点自带 MTP 头 / 16k。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8140"

[model]
name = "qwen3.8-27b"
path = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
format = "awq"
quant = "w4a16"
head_quant = "rtn-int4-g32"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
pool_tokens = 16896
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 3
draft = "mtp"
draft_kv_fp8 = false

[kernel]
kv_fp8 = true
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
