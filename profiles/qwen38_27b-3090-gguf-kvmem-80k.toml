# GGUF × KVMem · 论文 24GB 消费档的 80K execution view。
#
# 64K profile 在 90K 上下文上仍丢针；80K 是论文 Table 3 的 80K execution view
# 口径，90K coherent needle 实测命中 BLUEBIRD-42。
extends = ["qwen38_27b-3090-gguf-kvmem-64k.toml"]

[pool]
# 压池到 ~85.5K，使 90K 上下文真正触发 host 下沉；仍留 80K view + chunk
# （2576 页 < 池 2674 页）。
vram_reserve_mb = 1500

[kvmem]
workspace_per_req = 81920
# 90K 实测：r16 仍命中 BLUEBIRD-42，墙钟 96.5→88.3s；
# 选择/Q 每 16 chunk，索引每 4 chunk，视图/驻留每边界（冻结选择）⇒ 不堆到末尾
recall_every = 16
