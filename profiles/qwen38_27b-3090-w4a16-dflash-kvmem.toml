# 27B AWQ W4A16 + DFlash2 d7 + KVMem 部分驻留（3090 Ti 24G;2026-10-23）
#
# 目的：同时使用 KVMem overcommit（select_partial）与 DFlash2。
# 前置：verify 视图化（`exec/spec.rs::verify_view_tables`）已落地；
#       select_partial 档只允许 v2 decode/verify（FI/XQA 页表读会话链）。
#
# 工作集 8192 tok（256 页 = sink 2 + recent 4 + top-k 250）：
#   2240 tok（70 页）在 90k 上下文会把可见历史压到 2.2k，80,480 池下
#   随机词 word salad 输出退化成 "Yes/user/assistant"；8192 tok 恢复连贯。
#   注意：coherent NIAH 下 2240 也能召回（针块选中），8192 是 OOD 稳健性
#   余量，不是召回正确性的硬前提。90k spec on 实测 2240 出现 m=0×6/输出
#   退化；8192 为 AL 3.00 / 输出连贯，故默认 8192。16k 轮 194ms / AL 1.60。
#
# 起服：
#   ./target/release/server -p profiles/qwen38_27b-3090-w4a16-dflash-kvmem.toml \
#     --log-level info
#
# 预检：
#   ./target/release/server -p profiles/qwen38_27b-3090-w4a16-dflash-kvmem.toml --check
extends = ["qwen38_27b-3090-w4a16-dflash.toml"]

[runtime]
max_seq = 262144
max_concurrency = 1

[pool]
prefix_cache = true
host_cache_mb = 10240
snap_host_mb = 1024
snap_max = 1
kv_fp8 = true
vram_reserve_mb = 512

[kvmem]
select_decode = true
select_partial = true
index = true
pool_overcommit = true
workspace_per_req = 8192
# verify 视图带宽上限（token；0 = 跟随 workspace）。实验档：只裁 verify，
# decode 仍用 workspace；16k+8k 实测 AL 1.90 但输出退化，生产保持 0。
# verify_view_tokens = 8192
# GQA 聚合：max = 上游产品默认（组内 query head 取最大余弦）
gqa_aggregation = "max"
select_sink = 2
select_recent = 4
recall_every = 1
evict_policy = "lru"

[kernel]
decode_arm = "v2"
verify_arm = "v2"
fi_cuda_graph = false
fi_plan_bake = false
fi_plan_restore = true

[server]
bind = "127.0.0.1:8141"

[parallel]
device = ["41:00.0"]
