# ============================================================================
# owl 公开配置模板（full.toml）
# ============================================================================
#
# 这里只列用户需要关心的键；诊断/内部面（[probes]、[cuda] 细项、loader dump、
# kvmem 诊断等）默认不在模板里，需要时用 `--set` 临时开启。
#
# 用法：
#   cp profiles/full.toml my.toml
#   # 改 [model] path / [parallel] device / [server] bind
#   server -p my.toml --check
#
# 其它档用 extends 继承本文件，只写差异。路径相对声明它的文件。
# ============================================================================

extends = []

# ---------------------------------------------------------------------------
# [server] —— HTTP 服务面
# ---------------------------------------------------------------------------
[server]
# 监听地址；服务无鉴权，不要直接暴露到公网。
bind = "0.0.0.0:8137"
# 原始请求 JSON 落盘（空 = 关；含业务数据，开启前确认隐私）。
request_dump_dir = ""
# 模板覆盖（空 = 模型快照内 chat_template.jinja；相对路径 = 相对模型目录）。
template_path = ""
# 模板变量文件（空 = 自动找 <model.path>/chat_template.toml）。
template_vars = ""

# ---------------------------------------------------------------------------
# [runtime] —— 上下文 / 调度 / 准入
# ---------------------------------------------------------------------------
[runtime]
# 满员姿态：reject | queue | queue:<ms>
admission_on_full = "reject"
# 未带 max_tokens 时的生成长度 / 单请求上限
default_max_new = 4096
max_new_cap = 32768   # FIXME: 这个参数是做什么的? 是否和 max_context_length 重复?
# 上下文上限（token）
max_context_length = 32768
# prefill 块长；越大吞吐越高，但激活工作区也越大
prefill_chunk = 512
# 最大同时活跃请求数（gdn_slots / max_batch 由它派生）
max_concurrency = 1

# ---------------------------------------------------------------------------
# [parallel] —— 并行与卡位
# ---------------------------------------------------------------------------
[parallel]
# single | tensor(TP2)
mode = "single"
# 卡位：BDF / UUID / 名字子串；禁 CUDA 序号。空 = 自动挑空闲卡。
device = []
# TP allreduce 拓扑：v1 | fused | ar2
tp_ar = "v1"
# TP AR 载荷使用 fp8
tp_ar_f8 = false
# TP 通信通道：p2p | host
tp_comm = "p2p"
# lm_head 词表切分（需 mode = tensor）
tp_vocab_split = false

# ---------------------------------------------------------------------------
# [model] —— 模型资产
# ---------------------------------------------------------------------------
[model]
# 服务端模型名；空 = GGUF 文件名 / 服务端缺省
name = "qwen3.8-27b"
# 目录（safetensors / awq）或 .gguf 单文件
path = "../models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
# safetensors | awq | gguf
format = "awq"
# 量化方案，必须与 format 匹配：w4a16 | w4a8 | nvfp4 | q4k | iq4 | iq3
quant = "w4a16"
# lm_head 量化：off | rtn-int4-g32 | rtn-int8-row
head_quant = "rtn-int8-row"
# embedding 表量化：f16 | i8
embed_quant = "f16"

[model.rope]
# YaRN 外推；只对 GGUF 档生效（1.0 = 关）
yarn_factor = 1.0
# 0 = 使用模型自带 context_length
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

# ---------------------------------------------------------------------------
# [store] —— KV / GDN / 宿主 / 磁盘
# ---------------------------------------------------------------------------
[store]
# 显存治理：驱动 total 的占比；以及池外固定预留 MiB
vram_budget = 0.99
vram_activation_reserve = 714
# 宿主/快照/磁盘腿（MiB；0 = 关层）
ram_pool_size = 0
disk_pool_size = 0
# 磁盘目录：给了磁盘配额就必须给，且必须独占
disk_dir = ""
# 前缀缓存（跨 turn / 跨会话复用）
prefix_cache = true

[store.kv]
# 主 KV 池 dtype：f16 | fp8 | int8
kv_dtype = "fp8"
# 草稿池 dtype：bf16 | fp8
draft_kv_dtype = "bf16"

[store.gdn]
# 同时推进的 turn 上限；也是服务面 permit 数的唯一真源
# GDN 快照设备槽数（0 = 关闭快照池）
snap_max = 0
# 消息开启标记覆盖（空 = 模型 ChatFormat.im_open）
snap_msg_delim = ""
# 每会话持久快照上限（Tail + History；必须 >=1；0 不再合法）
snap_session_cap = 30
# 最近 snap_tail 张连续保留；更早的点按 token 位置均匀选 History
snap_tail = 12

# ---------------------------------------------------------------------------
# [spec] —— 投机解码
# ---------------------------------------------------------------------------
[spec]
# 深度（0 = 关）
depth = 0
# 草稿检查点目录（depth > 0 时必填）
draft_path = ""
# 哑草稿诊断面
dumb = false
# DFlash2 草稿环窗口（0 = auto）
draft_window = 0
# DFlash2 lookup-augmented drafting
lookup = false
lookup_nmin = 6
lookup_nmax = 12
lookup_nstrong = 6
lookup_agree = 0
# MTP 草稿窗口 / sink / 生效 ctx
mtp_window = 0
mtp_sink = 64
mtp_window_min_ctx = 0
mtp_ring = false
# 自适应深度（仅 MTP）
adaptive_depth = false
depth_min = 3
depth_switch_ctx = 49152
adaptive_min_tpr = 3.0
# TP 档放行投机
tp_draft = false
# m=0 连击降级阈值 / 探测窗口
degrade_after = 6
probe_every = 8

# ---------------------------------------------------------------------------
# [vision] —— 视觉
# ---------------------------------------------------------------------------
[vision]
enabled = false
# GGUF 视觉塔路径（空 = 模型内置 / 同目录 mmproj）
path = ""
# 图像预处理像素封顶（0 = 不缩）
max_pixels = 0
# 前缀无感删除
image_evict = false
# 图像段页对齐 pad 词（必须恰 1 token）
image_evict_pad = "。"

# ---------------------------------------------------------------------------
# [sampling] —— 采样
# ---------------------------------------------------------------------------
[sampling]
# greedy | sampling
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.95
rep_penalty = 1.0

# ---------------------------------------------------------------------------
# [load] —— 装载
# ---------------------------------------------------------------------------
[load]
# 单键暂存槽上限 MiB；0 = 不设上限
staging_mb = 128
# auto | device | cpu
repack = "auto"

# ---------------------------------------------------------------------------
# [kvmem] —— 池虚拟化 / 选择层（高级）
# ---------------------------------------------------------------------------
[kvmem]
select_decode = false
select_partial = false
index = false
index_gpu = true
workspace_per_req = 2240
verify_view_tokens = 0
gqa_aggregation = "max"
query_replay = false
select_sink = 2
select_recent = 4
select_stratified = 0
select_sink_tokens = 0
select_recent_tokens = 0
select_query_tokens = 64
score_mode = "cosine-max"
select_graph_alpha = 0.0
recall_every = 1
prefill_view = "on-hole"
prefill_select = "topk"
evict_policy = "lru"
bulk_drop_when_tier_full = false
pool_overcommit = false
dense_floor_mib = 0

# ---------------------------------------------------------------------------
# [kernel] —— 算子臂（高级）
# ---------------------------------------------------------------------------
[kernel]
qkv_fuse = true
verify_arm = "v2"
decode_arm = "fi"
# baked | host-sync
fi_plan = "baked"
fi_cuda_graph = true
prefill_shadow = false
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
# GGUF 小 n 走 MMVQ 的 L2 上限（MiB；0 = 关）
gguf_mmvq_l2_mib = 4
gguf_tile = true
gguf_cublas = true
gguf_mmq2 = true
gguf_mmq = true
gguf_smem = true

# ---------------------------------------------------------------------------
# [log]
# ---------------------------------------------------------------------------
[log]
# off | error | warn | info | debug | trace
level = "warn"
tags_allow = []
tags_deny = []
max_mb = 0
keep = 0
timestamp = false
