# ============================================================================
# owl 全量配置模板(`full.toml`)
# ============================================================================
#
# 本文件是**唯一全量档**:所有键都显式写出(缺一个就拒启 —— 启动点可复现)。
# 其它档用顶部 `extends` 继承它,只写自己的差异:
#
#   extends = ["full.toml"]        # 相对本文件;也可写绝对路径;数组按序覆盖
#   [model]
#   path = "/path/to/checkpoint"
#   [parallel]
#   mode = "tensor"
#   device = ["3090", "3090"]      # BDF / UUID / 名字子串(禁 CUDA 序号)
#
# 生成/校验:
#   server -p profiles/full.toml --check
#   server -p profiles/full.toml --print-config   # 生效值(+ 来源)
#
# 本文件里的值 = **一个可跑的单卡 27B AWQ 配置**(3090 Ti 24G / 128k);
# 复制出去改站点事实即可(改完记得 `--check`)。
# ============================================================================

# 继承列表:按序覆盖(后者胜);相对路径 = 相对**声明它的这个文件**。
extends = []

# ---------------------------------------------------------------------------
# [server] —— HTTP 服务面(监听 / 模板 / 工具解析)
# ---------------------------------------------------------------------------
[server]
bind = "127.0.0.1:8137"
# 原始请求 JSON 落盘目录（空 = 关；每请求一份 body，供前端联调复现；
# 含业务数据/图片 data URL，开启前确认隐私与磁盘容量）。
request_dump_dir = ""
# 模板路径覆盖:空 = 用模型快照 `<model.path>/chat_template.jinja`;
# 相对路径 = 相对模型目录。
template_path = ""
# 工具三通道解析(关 = 工具文本原样进 content —— 诊断臂)
parse_tool_calls = true
# 工具格式(必须与模板同值):xml | json
tool_call_format = "xml"
# 有工具即关思考(模板同名变量)
auto_disable_thinking_with_tools = false
# 思考档位缺省(OpenAI 同名协议值;请求带 reasoning_effort 时以请求为准)
reasoning_effort = ""

# ---------------------------------------------------------------------------
# [runtime] —— 引擎运行时(上下文 / 调度 / 准入 / 会话缺省)
# ---------------------------------------------------------------------------
[runtime]
# 自动挑卡的空闲显存阈值(0..1;低于它就跳过该卡)
gpu_min_free_ratio = 0.9
# 并发闸门:在跑 + 排队上限;须 ≤ pool.gdn_slots(每会话一格 GDN 状态)
max_concurrency = 1
# 隐式默认会话(请求不带 session 时落到会话 0;false = 每请求临时会话)
implicit_session = false
# 未带 max_tokens 时的生成步数 / 夹紧上限
default_max_new = 4096
max_new_cap = 8192
# 排队超时(毫秒;0 = 关)
queue_wait_ms = 0
# 上下文上限(token)
max_seq = 131072
# 预填块长 / 尾块合并阈值(剩余 ≤ chunk + tail_merge ⇒ 一口气吃完)
# ⚠️ 不要直接把 chunk 拉到 2048/4096：Marlin 在 m>1024 会按 max_par 拆 M，
#    每段各重读一遍完整权重；当前 512 不触发。改前先看 marlin-v2 的 split=。
prefill_chunk = 512
prefill_tail_merge = 512
# 跨会话合批上限(1 = 串行;>1 需 gdn_slots ≥ 它、单卡、无选择层)
max_batch = 1
# 相位时间片:每 slice_every 拍 decode 插一片 prefill(0 = 关)
slice_every = 0
slice_tokens = 0
# 准入:给未来新人的预留 token / 在位者最小生成量 / 池保留页 / 队列上限
newcomer_min_tokens = 4096
min_gen_tokens = 256
reserve_pages = 0
max_queue = 0

# ---------------------------------------------------------------------------
# [parallel] —— 并行与卡位(唯一真源)
# ---------------------------------------------------------------------------
[parallel]
# single | tensor(TP2) | layer(暂未支持 = 拒启)
mode = "single"
# 卡位:每项 = BDF("41:00.0")/ UUID("GPU-…")/ 名字子串("3090");
# **禁 CUDA 序号**(序会漂)。空 = 自动挑空闲卡(single 1 张 / tensor 2 张);
# 按列表序去重消费:["3090","3090"] = 两张不同的 3090。
device = []
# TP 通信数据腿:push(写对端)档(需 mode = tensor)
tp_push = false
# TP AR 载荷 fp8(两侧同档)
tp_ar_f8 = false
# lm_head 词表切(每 rank 只持半表;需 mode = tensor)
tp_vocab_split = false
# v1 两核融合档(AR 一核做完两段;需 mode = tensor)
tp_ar_fused = false
# barrier-only AR-2(小包 graph;≤64KiB/非 fp8;需 mode = tensor,与 tp_one_stage 互斥)
tp_ar2 = false
# 1-stage 对称 arena(结构更对但实测中性;需 mode = tensor,与 tp_push 互斥)
tp_one_stage = false

# ---------------------------------------------------------------------------
# [model] —— 模型资产
# ---------------------------------------------------------------------------
[model]
# 对外模型名(空 = GGUF 用文件名 / 其它用服务端缺省)
name = "qwen3.8-27b"
# 模型路径:目录(safetensors / awq)或 .gguf 单文件
path = "../codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
# 权重摆放格式:safetensors | awq | gguf
format = "awq"
# 主干量化方案:
#   safetensors/awq → w4a16 | w4a8 | w8a8i(暂未支持) | w8a8f(暂未支持)
#   gguf            → q4k | iq4 | iq3
quant = "w4a16"
# lm_head 量化:off | rtn-int4-g32 | rtn-int8-row | rtn-int8-row-a8
# 2026-10-22 用户裁决:int4 头太小,int8 为默认(质量优先;int4 仅显式覆盖)
# int8 = W8A16:多 token 自动走 f16 Tensor Core(2026-10-22;HBM 读 int8、
#   寄存器反量化、激活 f16),质量门 0.9896。
# a8 = W8A8 诊断档:8-bit 走 SM86 int8 TC(无 fp8 TC);spec m=7/8
#   质量门 0.6962(<0.95),且被 W8A16 TC 同速支配 ⇒ **不推荐**。
head_quant = "rtn-int8-row"
# embedding 表量化:f16(默认/对照) | i8(per-row;省 ~1.2G,仅 untied)
embed_quant = "f16"
# 视觉塔(纯文本档勿开);vision_path 空 = 用检查点内置 model.visual.*
vision = false
vision_path = ""

[model.rope]
# YaRN 外推(1.0 = 关;2.0 → 524k,4.0 → 1M);只对 GGUF 档生效
yarn_factor = 1.0
# 0 = 用模型自带 context_length
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
# 额外 attention 乘子(乘在 0.1·ln(factor)+1 上)
attention_factor = 1.0

# ---------------------------------------------------------------------------
# [pool] —— 设备池与显存治理
# ---------------------------------------------------------------------------
[pool]
# 主 KV 池 fp8 e4m3(32 KiB/token;容量翻倍)
kv_fp8 = true
# 设备 KV 池(2026-10-22;不再有手工容量键):
#   prefix_cache=false → min(剩余显存 cap, max_seq×并发 + 1 页)
#   prefix_cache=true  → cap(整池可被前缀缓存持有,新请求逐出到 host/disk)
# 并发上限(每活跃会话一格 GDN 状态;0 = 自动 = runtime.max_concurrency)
gdn_slots = 1
# 末段页对齐(前缀复用闭环;单块档多切一刀)
prefill_align_tail = true
# 生成相位页边界快照页步长(0 = 关)
snap_decode_stride = 1
# GDN 快照池槽数
snap_max = 0
# 消息边界快照（缺省关；agent 档开）。开 = 在消息开启标记前取页对齐边界，
# prefill 在边界切块并拍 Durable 快照，供同 system/tool 前缀跨会话复用。
# 依赖 prefix_cache=true + snap_max>0；无消费者 = boot 告警。
snap_msg_boundary = false
# 消息开启标记文本覆盖（空 = 用模型 ChatFormat.im_open，如 Qwen <|im_start|>）
# 引擎 boot 时 tokenize；扫描函数只收 open_ids 参数，不写死字面量。
snap_msg_delim = ""
# 后续消息边界的稀疏间隔（token；第一条边界无条件保留）
snap_msg_min_gap = 2048
# 距当前 fed 小于本值（token）的边界不单独切块；0 = 不设下限（推荐，
# 否则边界落在 chunk 起点附近会被跳过，system 前缀反而丢）
snap_msg_min_span = 0
# 宿主 KV 腿 / 快照腿 / 盘层两腿(MiB;0 = 关)
host_cache_mb = 0
snap_host_mb = 0
disk_cache_mb = 0
snap_disk_mb = 0
# 盘层目录(给了配额就必须给;必须独占)
disk_dir = ""
# 临时块复用池上限(MiB;0 = 不限)
pool_cap_mb = 256
# 显存目标占比 / 预留 MiB
vram_target = 0.99
vram_reserve_mb = 256
# 显存硬上限 MiB(留空 = 只按驱动账判)
vram_budget_mb = 0
# 前缀缓存开/关
prefix_cache = true
# **前缀无感删除**(图像段;2026-10-23):客户端给图像打 `owl_evict` 标记时,
# 引擎把图像段补 pad 到页对齐并记为删除候选;下一轮若该段真的被删 ⇒ 保留后缀
# 页 + 后缀 K 乘 R(−S)(位置帧平移),不重算删点之后的 token。
# **引擎不自作主张**:没有标记的图一律走旧路径。需 prefix_cache = true 且
# 分页 KV(f16 或 fp8-e4m3;FP8 的 delta_limit 必须 1..=4)。
# 缺省关 = 逐字节旧行为。
image_evict = false
# **删除后处理模式**(2026-10-25):`rebase` = 删后旋转后缀 K(旧行为,
# FP8 需 delta_limit);`leave_gap` = 删后不转 K、不移动幸存 token position,
# 新 token 从 max_pos+1 追加(无叠转漂移、无周期整段重建)。
# 产线先用 rebase;leave-gap 在 0.8B/27B 验收后单独开。
image_evict_mode = "rebase"
# **叠转上限**(2026-10-23):一条链允许被 K 重转的次数;到顶后**下一轮删除
# 触发一次整段重建**(全量 prefill + GDN 重置,漂移与计数归零)。
# f16 每轮约 0.4~0.6 ulp,实测 N=4/16/32/64 ⇒ 2.5/7.7/13.7/25.2 ulp(最差元素;
# 门 `kv_rope_k_shift_drift_under_repeats`)。缺省 32 ≈ 13.7 ulp;0 = 不限。
# **FP8 档**:每轮重落 e4m3 网格,必须设 1..=4(boot 门硬拒 0/大于 4);
# 三图 GUI 窗口用 4。
image_evict_delta_limit = 32
# 页对齐 pad 词（必须恰 1 token；空 = 自动 `。`→` `→`\n`）。
# 27B 实测 `。` 在 8 图/8 次删除下稳定；"\n" 从第 3 张标记图起会吐 `< >`。
image_evict_pad = "。"
# 解释器块池预算(字节;0 = 关)
block_pool_bytes = 0
# 关活性中途回收(诊断;开会无界常驻)
no_reclaim = false

# ---------------------------------------------------------------------------
# [spec] —— 投机解码
# ---------------------------------------------------------------------------
[spec]
# 深度(0 = 关;结构上限 7)
depth = 0
# 草稿检查点目录(空 = 未配;depth>0 时必填)
draft_path = ""
# 哑草稿诊断面(无草稿器时)
dumb = false
# 草稿池 fp8(关 = bf16)
draft_kv_fp8 = false
# DFlash2 草稿环窗口(token;0 = auto = 检查点声明,缺声明 = 家族 2048;当前核支持 2048)
draft_window = 0
# DFlash2 lookup-augmented drafting（LABD；仅 DFlash2 档可开）
# 在当前请求 token 历史里找当前后缀的最近一次出现，用其后续 token 覆盖草稿头；
# 缺省关 = 旧档逐字节不变。nmin/nmax/nstrong/agree 语义见 docs/devlog/perf/tp2-decode-fast.md §10。
lookup = false
lookup_nmin = 6
lookup_nmax = 12
lookup_nstrong = 6
lookup_agree = 0
# MTP 窗口/sink 的全量 schema 缺省(0 = full)。**实际性能值写在具体 MTP 档**
# (如 profiles/parts/feature/mtp-window.toml 的 4032/64)，不要在这里做调优。
mtp_window = 0
mtp_sink = 64
# 窗口生效的最小绝对 ctx(0 = 不设额外门槛;短 ctx 保完整历史)
mtp_window_min_ctx = 0
# 自适应 depth(仅 MTP;短 ctx 用 depth,长 ctx 回 depth_min)。
# 两档图族在 boot 期预捕获;缺省关 = 旧档逐字节不变。
adaptive_depth = false
depth_min = 3
depth_switch_ctx = 49152
# T1b 滚动降档门(tokens/round = m+1;仅 adaptive 生效)
adaptive_min_tpr = 3.0
# verify 图 taps 退回 last_hidden(排查开关)
notaps = false
# TAPDECL 二分臂(声明期 tapped 不挂输出槽)
tapdecl = false
# TP 档放行投机(未验完的档不许静默放行)
tp_draft = false
# m=0 连击降级阈值(0 = 禁用)/ 降级后的探测窗口(tokens)
degrade_after = 6
probe_every = 8

# ---------------------------------------------------------------------------
# [sampling] —— 采样
# ---------------------------------------------------------------------------
[sampling]
# greedy | sampling
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.95
rep_penalty = 1.0

# ---------------------------------------------------------------------------
# [load] —— 装载域(校验 / 观测 / 重排)
# ---------------------------------------------------------------------------
[load]
verify = false
debug_tap = false
# 暂存槽上限 MiB(0 = 不设上限)
staging_mb = 128
# auto | device | cpu
repack = "auto"
dump = false

# ---------------------------------------------------------------------------
# [kvmem] —— 池虚拟化/选择层
# ---------------------------------------------------------------------------
[kvmem]
select_decode = false
select_partial = false
index = false
# 索引采集走 GPU 块级 Mean-K（false = 旧 host 整页回读，golden/排障）
index_gpu = true
workspace_per_req = 2240
# verify 视图带宽上限（token；0 = 跟随 workspace；只裁 verify，decode 不动）
verify_view_tokens = 0
# GQA 聚合：mean | max（KVMem 产品脚本默认 max）
gqa_aggregation = "max"
# 最终 query replay（KVMem §5.2；当前仅 spec.depth=0）
query_replay = false
select_sink = 2
select_recent = 4
recall_every = 1
coverage_probe = false
analyze_at_ctx = 0
# lru | lrfu | lrfu:0.8
evict_policy = "lru"
# **整枝塌缩**(2026-10-23):Drop 轮是否允许"一张票丢一整段"(叶→分叉点)。
# 缺省 false = 保守:只要宿主/磁盘有空位就逐块(先缩小到装得进宿主,再由
# 下沉/搬盘接走,内容优先保留);没有分层的档位本来就走整枝。
# 开 = 当链**这一轮搬不走**(宿主剩余槽 < 链长)时允许整枝丢 —— 避免
# "宿主/磁盘长期满 + 深冷枝"要 O(深度) 个调度轮才腾干净。
# 淘汰只看时间(新鲜度),不看内容"贵不贵"。
bulk_drop_when_tier_full = false
pool_overcommit = false
# 每 turn 工作集下限 MiB(留空 = 派生)
dense_floor_mib = 0

# ---------------------------------------------------------------------------
# [kernel] —— 算子/臂选择(原 [dispatch])
# ---------------------------------------------------------------------------
[kernel]
qkv_fuse = true
prefill_split = false
force_naive_prefill = false
# 单键臂(2026-10-21;旧 verify_v2/verify_fi/verify_xqa + decode_fi/decode_xqa 已退役)
verify_arm = "v2"
decode_arm = "fi"
# 单图烘 plan(上界恒 = runtime.max_seq;true 需 fi_plan_restore = false + fi_cuda_graph = true)
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
# prefill-only FP8→F16 shadow(实验;默认关,仅 pool.kv_fp8=true 可用;
# f16 主池 + 本键 = validate 拒启。首层按 runtime.max_seq 预留,
# 100k≈200MiB/rank,262k≈512MiB/rank;decode/verify 仍走 fp8)
prefill_shadow = false
xqa_prefill = false
fi_min_tokens = 1
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
# W4A8 Marlin int8 m8 8-row 解码(实验;3080 A/B 无收益,默认关)
marlin_w4a8_m8 = false
# GGUF 小 n(装得进 L2)且 m ≤ TILE_MT ⇒ 让 MMVQ 赢(0 = 关)
gguf_mmvq_l2_mib = 4
# GGUF 预填臂(缺省全开;关 = 回退下一臂)
gguf_tile = true
gguf_cublas = true
gguf_mmq2 = true
gguf_mmq = true
gguf_smem = true
resolve_trace = false
host_argmax = false
ts_probe = false
tag_wildcard = false

# ---------------------------------------------------------------------------
# [probes] —— 诊断
# ---------------------------------------------------------------------------
[probes]
step_profile = false
# off | counters | host | gpu
perf_level = "host"
gdn_dump = false
debug = false
prefill_cksum = false
fact_probe = false
trace_gate = false
dflash_probe = false
propose_eager = false
dflash_eager = false
dflash_noencode = false
dflash_dumb = false
gdn_dump_all = false
pf_bisect = false
pf_stages = 0
pf_fin_check = false
raw_completion = false
prompt_dump = false
gdn_dbg = false
pf_fence = false
live_diag = false
recon_dbg = false
vram_dbg = false
idx_dbg = false
cov_dump = false
store_hook_dbg = false
pf_taps = false
l3_audit = false
gdn_diag = false
gdn_touch = ""
gdn_zero_scratch = ""
gdn_fresh_scratch = false
# 单步/粘滞调试门(需 --features stepgate 构建)
step_gate = "off"
step_gate_ms = 50
step_gate_us = 0
step_gate_every = 1
kv_dump_at = 0

# ---------------------------------------------------------------------------
# [cuda] —— 设备面(图 / 同步 / 实例化旗标 / 发射账)
# ---------------------------------------------------------------------------
[cuda]
# 图捕获总闸(false = eager 直发,连 decode/verify/fold/propose 族一起关)
graph = true
srv_timing = false
cap_prof = false
launch_sync = false
# 同步点分解掩码(0 = 生产;见 config::sync_bit)
sync_mask = 0
launch_time = false
d2h_prof = false
gpu_prof = false
free_legacy = false
# 捕获 slab 固定档 MiB(留空 = warmup 计量定量)
capture_slab_mb = 0
# 发射账容量(0 = 关)
trace_ring = 0

[cuda.graph_flags]
# UPLOAD = 0b10(实例化后预热上传)
upload = false
# DEVICE_LAUNCH = 0b100(设备侧派发;派发税排查面)
device_launch = false

# ---------------------------------------------------------------------------
# [log]
# ---------------------------------------------------------------------------
[log]
# off | error | warn | info | debug | trace
level = "warn"
tags_allow = []
tags_deny = []
max_mb = 0
keep = 0
timestamp = false
