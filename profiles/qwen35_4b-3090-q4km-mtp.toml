# owl 档 `qwen35_4b-3090-q4km-mtp` —— 4B Q4_K_M 单文件自带 NextN MTP 头 / 16k。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8142"

[model]
name = "qwen3.5-4b-gguf-mtp"
path = "../models/bartowski/Qwen_Qwen3.5-4B-GGUF/Qwen_Qwen3.5-4B-Q4_K_M.gguf"
format = "gguf"
quant = "q4k"
head_quant = "off"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
kv_fp8 = true
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 3
draft = "mtp"
draft_kv_fp8 = false

[kernel]
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
