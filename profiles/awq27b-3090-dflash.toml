# owl 引擎预设档 `awq27b-3090-dflash`(27B AWQ-INT4 + DFlash2 d7;单 3090 Ti)
#
# 用途 = **投机基准尺**:`docs/bench/qwen38-3090单卡-引擎会战.md` 补录Ⅲ 的
# `spec-on,DFlash2 d7 + XQA verify` 那一行(8192 = 76.08 t/s)就是这条形态。
# 本档用 **[intent] 形**表达(不是 `profiles/legacy/` 的低层档 —— 那批已漂移,
# 2026-10-21 实测起不来:E10 kv.draft 无写者 / E14 fp8 池双寻址,勿再引用)。
#
# 形态(由 intent 派生,见 `crates/shared/src/config/resolve.rs`):
#   model=awq27b · goal=max-speed · spec=dflash(depth 7)· kv=fp8(容量 ×2 + FI 读核)
#   graphs=auto ⇒ **FI 三面**(prefill 桶族 + verify 单图 + decode 单图)+
#   `fi_cuda_graph / fi_plan_bake=0 / fi_plan_restore=false` 三件套自动落位。
#   reuse=off(单会话最大上下文;前缀缓存对本矩阵是纯开销)。
#
# 起机(3090 Ti @41:00.0,UUID 钉卡):
#   CUDA_VISIBLE_DEVICES=GPU-e565c505-4921-9979-2e0f-2b83490b7aed \
#   target/release/server -p profiles/awq27b-3090-dflash.toml
#
# 测速(与文档同口径):
#   cd packages/llm_speedtest && uv run cli \
#     --api-url http://127.0.0.1:8140/v1/chat/completions \
#     --model qwen3.8-27b --flavor std --temperature 0 --top-p 1

[intent]
model = "qwen3.8-27b-awq"   # 注册表键(AWQ-INT4 + lm_head int4)
hardware = "3090ti-24g"
goal = "max-speed"
context = 16384
concurrency = 1
spec = "dflash"             # depth 7 由 intent 派生
kv = "fp8"                  # 容量 ×2 + FI 读核前提
kvmem = "off"
graphs = "auto"
reuse = "off"

[model]
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
# 草稿 = **syvai W4A16 pack-quantized**(生产形状;z-lab 的 BF16 源会被启动检查拒:
# 「BF16 源喂引擎 = 草稿全噪声 AL=0」)
dflash2_dir = "/home/div/Documents/codes/models/syvai/Qwen3.8-27B-DFlash2-W4A16"

[runtime]
bind = "127.0.0.1:8140"

[dispatch]
# ⚠️ 既有缺口(与本题无关,2026-10-20 已在 gguf 档登记):tag 词表缺 **layout facet**
# ⇒ `kv.main` 同时命中 Classic 与 kNHD 两种写者 ⇒ E14 双寻址拒启;
# 带投机还多一条 E10(`kv.draft` 有读者无写者 —— 同一 tag 缺口的下游表现)。
# 诊断档口径 = 通配跳过写集审计(allowed=None);本档实测走 kNHD 单路,不混写。
# 正解:给 `tags.toml` 加 `kv.layout.*` 互斥面并从配置派生(挂账)。
tag_wildcard = true

[sampling]
mode = "greedy"
