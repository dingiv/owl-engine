# owl 预设档 `spec-dflash`(27B AWQ-INT4 + DFlash2 d7 生产形状;2026-10-18 精简)
#
# 纪律:档内**只列最优且非缺省**的选项 —— 引擎缺省即最优的一律不复述。
# 站点/部署面(model.dir/dflash2_dir、bind、几何)由配套配置文件给,
# 启动 = `server -p profiles/legacy/spec-dflash.toml <site.toml>`。
# 详尽 why 在各设计卷;此处每键一行来源。

# --- 以下为**完整档**（2026-10-21）：所有字段显式声明，缺一个就拒启。
# 生成方式：server -p <旧档> --print-config > <新档>.toml

[runtime]
bind = "127.0.0.1:8138"
tp_push = false
tp_ar_f8 = false
tp_vocab_split = false
tp_ar_fused = false
gpu_min_free_ratio = 0.9
max_seq = 16384
prefill_chunk = 1024
max_batch = 1
prefill_tail_merge = 1024
slice_every = 0
slice_tokens = 0
newcomer_min_tokens = 4096
min_gen_tokens = 256
reserve_pages = 0
max_queue = 0

[model]
kind = "awq27b"
vision = false
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
name = "qwen3.8-27b"
dflash2_dir = "/home/div/Documents/codes/models/syvai/Qwen3.8-27B-DFlash2-W4A16"
head_quant = "rtn-int4-g32"
quant = "w4a16"

[model.rope]
yarn_factor = 1.0
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

[pool]
pool_tokens = 16896
gdn_slots = 1
prefill_align_tail = true
snap_decode_stride = 1
prefix_cache_share = 0.75
snap_max = 4
host_cache_mb = 4096
pool_cap_mb = 256
snap_host_mb = 3072
disk_cache_mb = 0
snap_disk_mb = 0
disk_dir = ""
vram_target = 0.99
vram_reserve_mb = 512
prefix_cache = true

[kvmem]
select_decode = false
select_partial = false
index = false
workspace_per_req = 2240
select_sink = 2
select_recent = 4
recall_every = 1
coverage_probe = false
analyze_at_ctx = 0
evict_policy = "lru"
pool_overcommit = false

[spec]
draft = "auto"
depth = 7
dumb = false
draft_kv_fp8 = false
notaps = false
tapdecl = false
tp_draft = false
degrade_after = 6
probe_every = 8

[sampling]
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.949999988079071
rep_penalty = 1.0

[load]
verify = false
debug_tap = false
staging_mb = 128
repack = "auto"
dump = false

[dispatch]
# GGUF 小 n(装得进 L2)且 m ≤ TILE_MT ⇒ 让 MMVQ 赢;0 = 关
# (2026-10-21 定谱:ssm_alpha/beta 每发 34.2→5.1 µs,verify −2.8 ms/轮)
gguf_mmvq_l2_mib = 4
# 单键臂(2026-10-21 合并:旧 verify_v2/verify_fi/verify_xqa + decode_fi/decode_xqa)
verify_arm = "fi"
decode_arm = "fi"
qkv_fuse = true
prefill_split = false
force_naive_prefill = false
fi_plan_bake = 0
fi_plan_restore = false
fi_cuda_graph = true
xqa_prefill = false
fi_min_tokens = 1
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
kv_fp8 = true
resolve_trace = false
host_argmax = false
ts_probe = false
tag_wildcard = false

[probes]
step_profile = false
perf_level = "host"
gdn_dump = false
debug = false
prefill_cksum = false
fact_probe = false
trace_gate = false
dflash_probe = false
propose_eager = false
dflash_eager = false
dflash_noencode = false
dflash_dumb = false
gdn_dump_all = false
pf_bisect = false
pf_fin_check = false
raw_completion = false
prompt_dump = false
gdn_dbg = false
pf_fence = false
step_gate = "off"
step_gate_ms = 0
step_gate_us = 0
step_gate_every = 0

[cuda]
srv_timing = false
cap_prof = false
launch_sync = false
sync_mask = 0
launch_time = false
d2h_prof = false
gpu_prof = false
free_legacy = false
trace_ring = 0

[cuda.graph_flags]
upload = false
device_launch = false

[graph]
no_graph = false

[server]
max_concurrency = 1

[agent]
implicit_session = false
default_max_new = 4096
max_new_cap = 8192
parse_tool_calls = true
tool_call_format = "xml"
auto_disable_thinking_with_tools = false
queue_wait_ms = 0

[log]
level = "warn"
tags_allow = []
tags_deny = []
max_mb = 0
keep = 0
timestamp = false
