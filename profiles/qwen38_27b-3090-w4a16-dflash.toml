# 单张 3090 Ti / 27B AWQ + DFlash2 d7 / 16k（测试/取证档）。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/hardware/3090-single.toml",
  "parts/kernel/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
snap_max = 4
prefix_cache = true
vram_reserve_mb = 512
host_cache_mb = 4096
snap_host_mb = 3072
# agent 10K 消息边界（delim 空 = 模型 ChatFormat.im_open）
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0
