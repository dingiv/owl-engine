# ── GGUF TP2 测量档(2026-11-03;K/I 超块放开后的双 3090 Ti 形状)─────────
#
# 用途:量 `UD-IQ4_XS`(14.25GB,`ssm_out` = Q5_K/Q4_K/IQ4_XS/Q3_K,原子 256 > hv 128)
# 在 **TP2** 下的 prefill/decode/数值一致性。此前该文件只能单卡(boot 响亮拒),
# 2026-11-03 起分片几何按"整原子段"聚合 + per-rank 激活置换表(详见
# `docs/devlog/models/gguf-tp2-kquant-设计.md` 与 `gguf-format.md` §15.8)。
#
# 实测(spec off,llm_speedtest 同口径,1 轮,输出 128):
#   prefill 512/8k : 单卡 1768.9/1855.1 → TP2 **2186.3/2520.6**(1.24×/1.36×)
#   decode  512/8k : 单卡  42.06/ 41.52 → TP2 **62.00/61.43**(1.47×/1.48×)
#   权重驻留      : 7.7 GiB/rank(单卡 14.9 GiB)
#   数值门        : 首 token 31/32、前 16 token 29/32 与单卡逐字一致
#                   (长输出按 TP 固有 f16-AR 语义混沌放大,tp2-log §18.5)
#
# spec 档(DFlash2 d7)另测:单卡 decode 156.45/119.85(512/8k);
# TP2 spec-on 需 `--set spec.tp_draft=true`,本档默认关(数值门用)。
#
# 端口纪律:双 3090 Ti = 8136(与 `qwen38_27b-3090_tp2.toml` 同端口,同卡互斥)。
extends = [
  "../full.toml",
  "../parts/model/27b-gguf-iq4xs.toml",
  "../parts/hardware/3090-tp2.local.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/fp8.toml",
]

[server]
bind = "0.0.0.0:8136"

[runtime]
keepalive_ms = 1000
max_seq = 32768
max_concurrency = 1
# GGUF prefill 走 MMQ2:chunk 越大发射/AR 次数越少;2048 是 8k prompt 的安全上限
# (4096 会触发 prefill 边界降级,见 `qwen38_27b-gguf_3090.toml` 注)。
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
# 数值门口径 = 关投机(greedy spec ≡ no-spec 才可判)。
# 生产/性能档:depth = 7 + lookup = true + draft_path(另加 `spec.tp_draft = true`)。
depth = 0
lookup = false

[parallel]
tp_vocab_split = false
