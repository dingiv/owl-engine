# INT8 KV 双 3090 Ti TP2 测量档（不计入入口档面）。
#
# 形状：TP2 + 词表切分 + K int8 / V packed / per-token+per-page scale；
#       spec off（int8 verify 未接）；无 index/coverage/select/image_evict。
# 口径：与 fp8 同 w4a8、同 max_seq、同 chunk；卡位用 UUID 覆盖更稳。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/hardware/3090-tp2.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/int8.toml",
]

[server]
bind = "127.0.0.1:8142"

[model]
quant = "w4a8"

[runtime]
max_seq = 262144
max_concurrency = 1
max_batch = 1
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
depth = 0
lookup = false
draft_path = ""

[pool]
prefix_cache = true
image_evict = false
snap_max = 2
host_cache_mb = 10240
snap_host_mb = 3072
vram_reserve_mb = 512
transient_reserve_mb = 1024
