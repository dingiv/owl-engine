# MTP × INT8 KV 稳定参考臂（W4A16 主干）。
#
# 与 qwen38_27b-3090-mtp-int8.toml 完全同形，只把主干换回 W4A16；
# W4A16 保留旧窗口语义（min_ctx=12288 / sink=64）：8k+输出走全历史，
# 避免历史 8k 尾部压缩回归。W4A8 的 4096/sink0 修复不带到本档。
extends = ["qwen38_27b-3090-mtp-int8.toml"]

[model]
quant = "w4a16"

[spec]
mtp_sink = 64
mtp_window_min_ctx = 12288
