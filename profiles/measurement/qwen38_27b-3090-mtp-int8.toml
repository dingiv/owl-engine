# MTP × INT8 KV 测量档（不计入入口档面）。
#
# 形状：单 3090 Ti / 27B AWQ / W4A8 主干 + 检查点自带 MTP 头（d3）
#       + INT8 KV（K int8 + V token-major）/ greedy / 无视觉。
# 口径：MTP 专项基线；prefix_cache 与 image_evict 关闭以隔离 decode。
# **2026-11-05 W4A8+INT8 AL 修复**：MTP 窗口提前到 4096 生效，并去掉
# sink（W4A8+INT8 的早期 prompt KV 噪声大；target hidden 已携带上下文，
# target verify 仍看全上下文）。8192 MATH d7/6 轮：
#   全历史 sink64 mAL 3.887 / tokens-per-round 4.887 / decode 66.0
#   win4032 sink64 mAL 4.318 / 5.318
#   win4032 sink0  mAL 4.805 / 5.805 / decode 78.7（两批 prompt 4.805/4.831）
# d3 + win4032 sink0：mAL 2.441 / tokens-per-round 3.441。
# 回退：`--set spec.mtp_window=0`（全历史）或 `--set spec.mtp_sink=64`。
#
# ⚠️ 本档默认 W4A8，用于 W4A8×MTP 测量；`--set spec.mtp_window=0` 可复现
#    全历史 AL 崩塌（mAL 3.887），作为回退对照。稳定参考臂见
#    qwen38_27b-3090-mtp-int8-w4a16.toml（或 --set model.quant=w4a16）。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/feature/mtp.toml",
  "../parts/feature/mtp-window.toml",
  "../parts/hardware/3090-single.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/int8.toml",
]

[server]
bind = "127.0.0.1:8141"

[model]
quant = "w4a8"

[runtime]
max_seq = 32768
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
depth = 3
draft = "mtp"
draft_path = ""
lookup = false
mtp_window = 4032
mtp_sink = 0
mtp_window_min_ctx = 4096
# MTP 目前没有草稿 KV 追赶臂；先关自动降级，避免 m=0 连击误切。
degrade_after = 0

[pool]
prefix_cache = false
snap_max = 0
host_cache_mb = 0
snap_host_mb = 0
vram_reserve_mb = 512
transient_reserve_mb = 1024
