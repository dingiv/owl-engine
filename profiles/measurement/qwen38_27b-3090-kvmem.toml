# ── KVMem 档:单张 3090 Ti / 27B AWQ-INT4 / 池超卖 + 选择层 ────────────────
#
# 形状:prefill = eager + Marlin W4A8;decode = **v2 分页核**(不是 FI);
#       投机 = DFlash2 d7(**verify 走 FI 图 + 视图页表**);KV = fp8 e4m3;
#       KVMem 选择层全开(视图 + 部分驻留 + 块下沉宿主);视觉塔开。
#
# 起机:`server -p profiles/measurement/qwen38_27b-3090-kvmem.toml`(不再需要 --set)。
#
# ── 密集区间(2026-10-27 修 margin 后)──────────────────────────────────────
# `reconcile` 的"懒沉余量"原式把 `workspace_per_req` 也扣进去(多扣 256 页
# = 8k tok),把**密集区间**从 47.7k 压到 37.4k。修正后余量只算"本 chunk 写入
# + 8 页"。实测(精确定位类任务:在资料里找某条结论):
#
#   | prompt | 修前 | 修后 |
#   |---|---|---|
#   | 36.4k / 43.3k / 44.0k | out=1(退化) | **out=64 正常** |
#   | 49.3k / 55.1k(超池,稀疏) | — | **out=25/15 正常**(检索到并引用) |
#   | 110k | — | 500(target 链预取超容,另一类问题) |
#
# ⚠️ 边界**不是硬阈值**:37k 附近仍会因"选中覆盖率"随机性个别失败
# (实测 36.7k 崩 / 40.3k 正常)—— 稀疏化后的可用性取决于"关键块是否被
# top-k 选中",不是 ctx 本身。真正需要全文通读的任务(拼接文档全文总结)
# 仍建议走非超卖档。
#
# ✅ **懒回灌(2026-10-28 W3)**:命中面**不再按池容量裁剪** —— turn 起只回灌
# `sink + recent 窗`(实测 34 块),其余命中块留占位符,由末边界召回后的
# `reconcile` 按选择面批量 stage-in(实测 502 块)。长会话追加轮因此从
# "尾部重算 38.6k tok" 降到秒级:
#
#   | 会话 | 首轮 TTFT | 追加轮(修前 → 修后) |
#   |---|---|---|
#   | 111k | 94.8 s | **44.0 s → 1.06 s** |
#   | 255k | 248.3 s | **500(宿主越界) → 2.07 s** |
#
# 机制/实测/残余见 `roadmap.local/26-10-28-KVMem-懒回灌-施工结案.md`。
# ══════════════════════════════════════════════════════════════════════════
# ✅ **超池长上下文已可用(2026-10-28 修根因后;旧的"可用上下文 = 池容量"作废)**
#
# 旧结论(64k 起 `out=1`)的根因 = **FI 的 ctx_total 口径错配**:模型层喂核
# `ctx_base + tokens`(**绝对** base),而视图页链只有 `view_tokens + 本 chunk` 页
# ⇒ 核越 `indptr` 读越界页号 ⇒ 注意力喂垃圾。**只要视图是真子集(丢一块也算)就必塌**,
# 与 ctx 无关 —— 所以表现为"越池就崩"。已修(`exec/prefill_chunk.rs` 显式喂
# `fi_plan_ctx = view_tokens + t` + 硬断守卫),台账见
# `roadmap.local/26-10-28-KVMem-位置定谳与三修.md` §6。
#
# 修后实测(真实中文台账 / greedy / 事实针在中段 / 选择题):
#
#   | prompt | ws=4096 | ws=8192 | ws=16384 |
#   |---|---|---|---|
#   | 108k | ✅ 命中 | — | — |
#   | 160k | ❌ 未命中(猜) | ✅ 命中 | ✅ 命中 |
#   | 211k(→160k 素材上限) | ❌ | — | ✅ |
#
# ⇒ 现在 **不再有"塌陷"**,只剩**覆盖率**:看得到的过去 = `workspace_per_req`。
# **覆盖率门**(`tools/kvmem_visibility_gate.py --task sections`,72k 文档实测):
#
#   | workspace | 物化比 | 小节标题召回 |
#   |---|---|---|
#   | 4096 | 5.6% | 3/7 (43%) |
#   | 8192 | 11% | 5/7 (71%) |
#   | 12288 | 17% | 6/7 (86%) |
#   | 16384 | 22.5% | 6/7 |
#
# ⇒ **按上下文挑工作集**:≤48k 用 4096(decode 105 t/s);48k~80k 用 8192~12288;
# 80k 以上用 16384(decode ~82 t/s)。`select_stratified` 在这些比值下**无量测收益**
# (48/2240=2% 的采样间隔远大于一个语义块)⇒ 缺省 0。
# "全文通读"类任务仍建议走非超卖 TP2 档。
# 本档的核心价值不变:**前缀复用**(48k 文档增量追问 28.7 s → 9 s)+ decode 视图。
# ══════════════════════════════════════════════════════════════════════════
#
# 2026-10-27 实测(本档):
#   prefill 4k/8k/16k/32k/64k = 2168 / 2116 / 2018 / 1795 / 1755 t/s;
#   decode(真实文本 8k/512 tok)= **83.0 t/s**,AL 2.83,verify 24.4 ms/轮;
#   48k 文档增量对话 ≈ 9 s(修 GDN 快照锚点前是 28.7 s,= 全量重算)。
#
# ⚠️ 三个"看起来能开、实际上会坏"的开关,本档已按实测焊死,改前三思:
#
# 1. `[kvmem].prefill_view = "always"` —— **机制上已不再致命**(2026-10-28 修
#    ctx_total 口径错配后,实测 160k 文档 always/on-hole 都能答,只有命中率差异),
#    但它让 prefill 也只读选中块:长 system / tools schema 里**未被覆盖**的部分
#    模型看不见(旧实测 60k system 退化到 1 token,当时叠加了上面的 bug)。
#    ⇒ agent 场景仍建议 **on-hole**。覆盖率门已立(见上 §覆盖率门):
#    72k 下 ws=4096 只有 43% 标题召回 —— 长 system/tools 想用 always 先把 ws 调够。
#    运行时用 `/debug/metrics` 的 `select.prefill_view.always_used` 自查。
#
# 2. `[kernel].decode_arm` 不能是 `fi` —— 本档 `select_partial = true`,
#    会话链上有宿主占位符,FI/XQA 的页表**直读会话链** ⇒ CUDA 700 + 上下文
#    毒化(配置层已拒启)。decode 必须 v2。
#    但 `verify_arm` **必须**是 `fi`:v2 分页核在 8 行 verify 形状下 51.5 ms/轮,
#    FI 只要 24.9 ms ⇒ decode 45 → 83 t/s(2026-10-27 `a9da5d20` 接通视图链)。
#
# 3. `[spec].degrade_after` **必须开**(= 6)。⚠️ 2026-10-28 更正旧结论:
#    旧注释说"降级期不写草稿 KV ⇒ 单向门"曾把这里设 0 —— **该前提已过期**:
#    降级臂现在逐 token 走 `prefill_dflash_encode(taps, pos)` 同步草稿 KV
#    (decode 图带 `tap0..4`,≈0.5 ms/tok = 2%),草稿上下文不断 ⇒ 探测真有机会命中。
#    同期 `DEGRADE_PROBE_MAX` 已由 512 下修到 **64**(512 时 400-token 请求一次
#    探测都撞不到 = 真单向门)。
#
#    为什么**关掉比开着更糟**(现场:前端 decode 速度突然掉一半、直到下一轮才恢复):
#    AL 掉到 ~1 时,m=0 的投机轮 ≈ 37 ms/token(verify 8 行 + propose 全付),
#    **比裸 decode(25-28 ms/token)还慢**;而 `degrade_after = 0` ⇒ 不降级、
#    也不探测 ⇒ 一路 27-40 t/s 直到 turn 结束(TurnSpecState 是 turn 域状态,
#    下一轮重建才"恢复")。开门后:窗口 AL < 盈亏线才降级 → 裸 decode →
#    最坏每 64 token 试一轮投机 → 命中即回 spec。
#    代价(该域真差时)= 每 64 token 多付一轮投机 ≈ **0.1 ms/token**。
# extends 路径**相对本文件**(在 `measurement/` 子目录 ⇒ 全部 `../`)。
# 为什么放在 `measurement/` 而不是顶层:`profiles/` 顶层的"入口档面"被
# `profiles.rs::入口档面只允许三个常驻档` 钉死(2026-10-24 用户裁决:
# 入口档只留硬件形状)。本档 = **同一硬件形状(单 3090)的另一配置**,
# 且 `workspace_per_req` 的取值(4096 = decode 最快 / 16384 = 长文命中率最高)
# 取决于任务形状 ⇒ 不是常驻生产档(见档头"超池长上下文已可用")。
# 固化目的(防 `--set` 误配)不受影响:`-p profiles/measurement/这档` 即可。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/feature/vision.toml",
  "../parts/feature/dflash2-27b.toml",
  "../parts/feature/kvmem.toml",
  "../parts/hardware/3090-single.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/fp8.toml",
]

[server]
bind = "127.0.0.1:8140"

[model]
quant = "w4a8"

[runtime]
# 池自动派生自 max_seq 与显存余量;超卖靠 [kvmem].pool_overcommit。
# 见档头红线:**这个数不是可用上下文上限**。
max_seq = 262144
max_concurrency = 1
# 2048 = 单卡 a8 天花板(4096 的工作区 136 MiB 会撞 vram-hard-budget)。
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[pool]
prefix_cache = true
# 2 槽 = 297 MiB(GDN 快照)。**不要设 0**:0 = 快照面整体关闭 ⇒ 前缀复用
# 只能退到 turn 起点(= 全量重算);也不要盲目加大(每份 148 MiB 挤设备池)。
snap_max = 2
# KV 块宿主腿:超卖档的下沉去处。10 GiB ≈ 10240 块。
host_cache_mb = 10240
# GDN 快照宿主预算。算锚点数 **按真实可用区间算,不按 max_seq**:
#   锚点 = ceil(可用 ctx / chunk / SNAP_EVERY=4),每份 = snap_row ≈ 148 MiB
#   · 本档可用 ~44k ⇒ 44k/2048/4 ≈ 5.4 份 ≈ **800 MiB** ⇒ 3072 有余量 ✓
#   · 若真把 max_seq 跑到 262k ⇒ 128 边界/4 = 32 份 ≈ **4.7 GiB**,3072 会丢
#     最冷的锚点(行为 = 复用点变近,不是错值)
# ⇒ 换档/加大 max_seq 时按上式重算,别照抄。
snap_host_mb = 3072
# **必须 512**(不是 kvmem 组件档里的 1024)。这不是"保守一点"的旋钮:
# reserve 每多 1 MiB,池就少 1 页(32 tok),**可用上下文跟着降**。
# 实测点:reserve=512 ⇒ 池 1492 页 = 47744 tok(= 本档真实可用上限);
# reserve=1024 ⇒ 池 980 页 = 31360 tok —— 小心别在"固化"时把档改小了
# (2026-10-27 本 profile 首版就踩了这一个)。
vram_reserve_mb = 512
# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
#
# 它兜的是 **prefill 的 chunk 工作区**(eager ⇒ 无捕获图 slab):
#   峰值 ∝ chunk 宽度,chunk=2048 实测单笔 120~136 MiB,叠加 vram_reserve 守卫地板
#   ⇒ 1024 MiB 是 chunk=2048 下的最小稳定档(768 MiB 实测差 34 MiB 翻车)。
#
#  **长文档档(≥80k)**:把下面三行改成
#     runtime.prefill_chunk = 1024
#     transient_reserve_mb  = 384
#     pool.vram_reserve_mb  = 256
#   ⇒ 池 47.7k → **76.4k(+60%)**,代价 prefill −17%(255k 首答 192→228 s)。
#   实测表见 roadmap.local/26-10-28-KVMem-位置定谳与三修.md §13.6。
transient_reserve_mb = 1024
image_evict = true
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0

[kvmem]
select_decode = true
# 块可下沉宿主 = 超卖的前提。**结构上要求** prefix_cache + decode_arm=v2
# + (投机档)verify_arm=v2|fi。
select_partial = true
index = true
index_gpu = true
# 召回预算 = 视图大小 = decode 的 attention 面。**4096 是本档实测最优点**
# (2026-10-27 扫描 4096 / 8192 / 12288):
#
#   | workspace | decode(8k/512tok) | AL | 70k 三问 | 95k 三问 | 110k 三问 |
#   |---|---|---|---|---|---|
#   | **4096** | **105.7 t/s** | **3.66** | 全 48 | 1/ERR/2 | 1/1/**29** |
#   | 8192 | 82.3 | 2.83 | 全 48 | 1/1/1 | ERR/ERR/ERR |
#   | 12288 | 83.8 | 2.83 | — | — | — |
#
# ⇒ 视图减半**没有牺牲召回**(sink/recent 不变,top-k 从 244 块降到 116 块仍够),
# 但 verify 扫的 KV 少一半 ⇒ decode +28%。**别凭直觉往大调**:16384 只挤池槽、
# 不改善长 prompt(实测 124k 仍退化)。
workspace_per_req = 4096
verify_view_tokens = 0
gqa_aggregation = "max"
query_replay = false
select_sink = 2
select_recent = 4
# 时间序分层抽样块数(P1-3 覆盖率门;0 = 关 = 旧行为)。
# >0 ⇒ 中间区间等距取块,保证全文每段都有一双眼(top-k 只填剩余位)。
select_stratified = 0
# 保底 sink/recent 的 **token 口径**(0 = 用上面的块数;参照实现配方 sink/recent=12288/1024 tok)
select_sink_tokens = 0
select_recent_tokens = 0
# query 窗(打分用最近多少行)。参照实现默认 512,但它的 Q 跨度是**最后一条 user
# 消息**,我们的 Q 是"最后 N 个 token" —— 实测 512 反而把信号稀释
# (72k/ws4096:softmax 5/7 → **2/7**)⇒ 本档保持 64。
select_query_tokens = 64
# 召回打分 scorer:`softmax-mean`(**参照实现默认**;设备三段核
# `owl_kvscore_{logits,maxsum,acc}`,72k/2240 块 ≈ 11 ms/边界)|
# `cosine-max`(折叠热路,host)| `cosine-mean` | `logit-mean`
#
# 实测(72k 文档 / ws=4096 / 可见性门 7 小节,各 2 次可复现):
#   cosine-max **3/7** → softmax-mean **5/7** → softmax + α0.2 **6/7**
# ⇒ 本档采纳 softmax-mean。
score_mode = "softmax-mean"
# 一跳邻接传播 α(参照实现 propagate_query_scores;0 = 关)。
# 与 softmax 打分**配套**:72k/ws4096 标题召回 5/7 → **6/7**(2/2 可复现);
# 配 cosine 打分时量不出收益(§8.3)⇒ 两者要一起用。
select_graph_alpha = 0.2
recall_every = 1
# 🔴 agent 场景必须 on-hole(见档头第 1 条)。
prefill_view = "on-hole"
# 召回点选块口径:`topk`(缺省,按 cosine 补足 = scattered)|
# `recency`(参照实现 prefill 口径 = 头 + 连续近期窗;2026-10-28 受控对照)
prefill_select = "topk"
coverage_probe = false
analyze_at_ctx = 0
evict_policy = "lru"
bulk_drop_when_tier_full = false
pool_overcommit = true

[kernel]
# decode 必须 v2(占位符);verify 必须 fi(v2 在 8 行形状下慢 2×)。
decode_arm = "v2"
verify_arm = "fi"
fi_plan = "baked"
fi_cuda_graph = true

[spec]
depth = 7
# 见档头第 3 条:开启降级 + 64-token 愈合探测(m=0 时裸 decode 更快;探测命中即回 spec)
degrade_after = 6
