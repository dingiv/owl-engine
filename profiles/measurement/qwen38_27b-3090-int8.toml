# INT8 KV 测量档（不计入入口档面）：单 3090 Ti / 27B AWQ-INT4。
#
# 形状：K int8 + V packed b16 + per-token/per-page scale；无 V shadow；
#       spec off（int8 verify 未接线）；无 index/coverage/select/image_evict。
# 口径：与 fp8 档同为 1B/elem，池容量 ≈ 262k；用于 prefill/decode 对比。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/hardware/3090-single.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/int8.toml",
]

[server]
bind = "127.0.0.1:8141"

# 单卡 24G 装不下 262k int8 池（per_tok=33056B）；131072 留足 65k 实测余量。
# ⚠️ w4a8 虽把 65k prefill 从 1163 提到 1711 t/s，但 8k needle 实测退化
#    （同 prompt w4a16 命中、w4a8 丢失）⇒ 质量门未过，生产档维持 w4a16。
[model]
quant = "w4a16"

[runtime]
max_seq = 131072
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
depth = 0
lookup = false
draft_path = ""

[pool]
prefix_cache = true
image_evict = false
snap_max = 2
host_cache_mb = 10240
snap_host_mb = 3072
vram_reserve_mb = 512
transient_reserve_mb = 1024
