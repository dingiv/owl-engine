# INT8 KV 测量档（不计入入口档面）：单 3090 Ti / 27B AWQ-INT4。
#
# 形状：K int8 + V token-major int8 + per-token V scale；无 V shadow；
#       spec off（本档保持无 spec 的 prefill/decode 测量基线；verify 已接线，
#       生产转正见 docs/devlog/kernels/int8-kv-attention-project.md §0.20.11）；
#       无 index/coverage/select/image_evict。
# 口径：与 fp8 档同为 1B/elem，池容量 ≈ 262k；用于 prefill/decode 对比。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/hardware/3090-single.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/int8.toml",
]

[server]
bind = "127.0.0.1:8141"

# 单卡 24G 装不下 262k int8 池（per_tok=33056B）；131072 留足 65k 实测余量。
# 2026-11-03 生产化：w4a8 + int8 P8 已过质量门。
# - 3 次中位（单 3090 Ti）：65k 1691.4 t/s / TTFT 38.75s；
#   100k 1488.4 t/s / TTFT 67.19s。
# - GSM8K n=200（thinking off, greedy）96.5%（193/200；FP8 参考 97.0%，
#   −0.5pp，在 1pp 门内；4 题 finish=length）。
# - needle 8k/32k/64k/100k 全 RETRIEVED。
# 旧“w4a8 8k 丢失”是 norm_rope/K/V scale 旧 bug，不是 W4A8 本身。
[model]
quant = "w4a8"

[runtime]
max_seq = 131072
# ✅ **1k 质量门已过（2026-11-04 结案）**：根因 = INT8 prefill 非末块
# 的 KV/GDN 写与末块 host/调度之间存在漏 event 的窗口；`prefill_chunk_enqueue`
# 在末块前加一次全设备 sync 后，1k/2k/8k/32k/120k 文本 needle 全 RETRIEVED
# （fresh server 3/3）。**不是** W4A8 批形状问题；固定 M/GEMV 实验已回滚。
# A/B/文本 1k 均已过：B 视觉与 `image_evict` 在 sync 后 36/36、slope≈1.0、
# hit@16px 100%；删除吸收实测 cached=192（保留后缀 5 页/192 tok）。
# 仍保持 measurement 直到 GSM8K/多图/长会话等更广质量集与正式性能复测闭环。sync 税已由 `llm_speedtest` 复测：std avg −0.02%，
# 32k/65k 在方差内；开关 `[runtime] int8_prefill_sync` 缺省 true。
# 最小门：`python3 tools/fixture/int8_text_gate.py --base http://127.0.0.1:8141`
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
depth = 0
lookup = false
draft_path = ""

[pool]
prefix_cache = true
image_evict = false
# 2026-11-04 收紧:单流测量档只用 1 槽(2 槽=228MiB 白留);生产档不改。
snap_max = 1
host_cache_mb = 10240
snap_host_mb = 3072
# 池外瞬态实测 20~25MiB/块 ⇒ 512→384 仍留 15× 余量(用户裁决:预留太保守)。
vram_reserve_mb = 384
transient_reserve_mb = 512
# store 搬运缺口(设备面);256→64MiB。
pool_cap_mb = 64
