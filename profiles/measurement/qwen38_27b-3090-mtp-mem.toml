# MTP 显存回退档（单 3090 Ti / 24G）。
#
# 定位：不是速度档，而是“DFlash 草稿放不下/要拿显存给主池”时的回退。
# 形状：W4A16 主干 + INT8 KV + MTP d7 + **MTP 草稿 KV fp8**（2 KiB/token）。
# 显存账（草稿侧，不含 target/主池）：
#   MTP 头 0.791 GiB + T5 ring 8.1 MiB（fp8，capacity 4160 tok）= 0.799 GiB
#   DFlash W4A16 1.193 GiB + ring 21.3 MiB = 1.214 GiB
#   ⇒ 约省 0.415 GiB ≈ 13.6k int8 KV token
# T5 ring 容量 = max(min_ctx=4096, sink+window+depth+page)，页对齐；
# ≤4096 保留完整历史，>4096 只读 sink+最近 4032。2026-11-05 实测
# capacity=4160 tok / 130 pages，57k needle 2k/8k/32k/56k×3 = 6/6。
extends = ["qwen38_27b-3090-mtp-int8-w4a16.toml"]

[runtime]
max_seq = 57344

[spec]
depth = 7
draft_kv_dtype = "fp8"
mtp_ring = true
mtp_window_min_ctx = 4096

[pool]
prefix_cache = false
snap_max = 0
host_cache_mb = 0
snap_host_mb = 0
vram_reserve_mb = 512
transient_reserve_mb = 1024
