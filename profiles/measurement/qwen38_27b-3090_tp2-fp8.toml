# FP8 KV 双 3090 Ti TP2 对照档（与 int8 档同形，仅池格式不同）。
extends = [
  "../full.toml",
  "../parts/model/27b-awq.toml",
  "../parts/hardware/3090-tp2.toml",
  "../parts/kernel/fi-graph.toml",
  "../parts/pool/fp8.toml",
]

[server]
bind = "127.0.0.1:8143"

[model]
quant = "w4a8"

[runtime]
max_seq = 262144
max_concurrency = 1
max_batch = 1
prefill_chunk = 2048
prefill_tail_merge = 0
implicit_session = true

[spec]
depth = 0
lookup = false
draft_path = ""

[pool]
prefix_cache = true
snap_max = 2
host_cache_mb = 10240
snap_host_mb = 3072
vram_reserve_mb = 512
transient_reserve_mb = 1024

[vision]
image_evict = false
