# owl 档 `gguf27b-vlm`（2026-10-21 GGUF 视觉塔 · 27B 单卡档）
#
# Qwen3.8-27B GGUF Q4_K_M + 同目录 mmproj-Q8_0 视觉塔，单张 3090 Ti；
# 文本主干走 GGUF 零解量化通道，塔走 MmprojSource（host 解量化 + F16）。
# 完整档（全字段显式，缺一拒启）：
#   ./target/release/server -p profiles/gguf27b-vlm.toml --check
# 图像走 OpenAI `image_url`（data URL）；单图、非合批；spec 关（本档只验视觉；MTP/DFlash2 另档）。

[runtime]
bind = "127.0.0.1:8144"
tp_push = false
tp_ar_f8 = false
tp_vocab_split = false
tp_ar_fused = false
gpu_min_free_ratio = 0.9
max_seq = 8192
prefill_chunk = 1024
max_batch = 1
prefill_tail_merge = 1024
slice_every = 0
slice_tokens = 0
newcomer_min_tokens = 4096
min_gen_tokens = 256
reserve_pages = 0
max_queue = 0

# 单卡卡位（本机 42:00.0 = 3090 Ti；换机器改这里或 --set runtime.device.bdf=…）
[runtime.device]
bdf = "42:00.0"

[model]
kind = "gguf"
vision = true
mmproj = "/home/div/Documents/codes/models/ggml-org/Qwen3.8-27B-GGUF/mmproj-Qwen3.8-27B-Q8_0.gguf"
dir = "/home/div/Documents/codes/models/ggml-org/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf"
name = "qwen3.8-27b-gguf-vlm"
head_quant = "off"
quant = "w4a16"

[model.rope]
yarn_factor = 1.0
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

[pool]
pool_tokens = 8192
gdn_slots = 1
prefill_align_tail = true
snap_decode_stride = 1
prefix_cache_share = 0.75
snap_max = 1
host_cache_mb = 0
pool_cap_mb = 256
snap_host_mb = 0
disk_cache_mb = 0
snap_disk_mb = 0
disk_dir = ""
vram_target = 0.99
vram_reserve_mb = 512
prefix_cache = false

[kvmem]
select_decode = false
select_partial = false
index = false
workspace_per_req = 2240
select_sink = 2
select_recent = 4
recall_every = 1
coverage_probe = false
analyze_at_ctx = 0
evict_policy = "lru"
pool_overcommit = false

[spec]
draft = "auto"
depth = 0
dumb = false
draft_kv_fp8 = false
notaps = false
tapdecl = false
tp_draft = false
degrade_after = 6
probe_every = 8

[sampling]
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.949999988079071
rep_penalty = 1.0

[load]
verify = false
debug_tap = false
staging_mb = 128
repack = "auto"
dump = false

[dispatch]
qkv_fuse = true
prefill_split = false
force_naive_prefill = false
verify_v2 = false
fi_plan_bake = 0
fi_plan_restore = false
fi_cuda_graph = true
verify_fi = true
decode_fi = true
verify_xqa = false
decode_xqa = false
xqa_prefill = false
fi_min_tokens = 1
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
kv_fp8 = true
resolve_trace = false
host_argmax = false
ts_probe = false
tag_wildcard = true

[probes]
step_profile = false
perf_level = "host"
gdn_dump = false
debug = false
prefill_cksum = false
fact_probe = false
trace_gate = false
dflash_probe = false
propose_eager = false
dflash_eager = false
dflash_noencode = false
dflash_dumb = false
gdn_dump_all = false
pf_bisect = false
pf_fin_check = false
raw_completion = false
prompt_dump = false
gdn_dbg = false
pf_fence = false
step_gate = "off"
step_gate_ms = 0
step_gate_us = 0
step_gate_every = 0

[cuda]
srv_timing = false
cap_prof = false
launch_sync = false
sync_mask = 0
launch_time = false
d2h_prof = false
gpu_prof = false
free_legacy = false
trace_ring = 0

[cuda.graph_flags]
upload = false
device_launch = false

[graph]
no_graph = false

[server]
max_concurrency = 1

[agent]
implicit_session = false
default_max_new = 4096
max_new_cap = 8192
parse_tool_calls = true
tool_call_format = "xml"
auto_disable_thinking_with_tools = false
queue_wait_ms = 0

[log]
level = "warn"
tags_allow = []
tags_deny = []
max_mb = 0
keep = 0
timestamp = false
