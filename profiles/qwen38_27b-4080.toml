# ── 单 4080 SUPER 32G / Qwen3.8-27B AWQ-INT4 + 视觉 ────────────────────────
#
# Ada sm_89 构建（--features arch-sm89）。32G 显存可开满 262144 上下文，
# prefill 走原生 FP8 MMA，decode 走 FI + DFlash2 d7。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[server]
bind = "0.0.0.0:8138"

[parallel]
mode = "single"
device = ["4080"]

[model]
quant = "w4a8"

[kernel]
prefill_shadow = false

[runtime]
admission_on_full = "reject"
max_seq = 262144
prefill_chunk = 2048

[sampling]
# agent 场景避免 greedy 复读
mode = "sampling"
temp = 0.3
topk = 20
topp = 0.95
rep_penalty = 1.00

[store]
prefix_cache = true
vram_reserve_mb = 970
host_cache_mb = 10240
snap_host_mb = 3072

[store.gdn]
snap_max = 2
snap_msg_delim = ""

[vision]
image_evict = true
