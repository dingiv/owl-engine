# ── 双 3080 20G / TP2 / Qwen3.8-27B AWQ-INT4 ─────────────────────────────
#
# 目标：262144 上下文 + 视觉 + 前缀缓存 + DFlash2 d7 同时可用。
# 形状：W4A8 主干 · INT8 KV · TP2 + 词表切分 · eager prefill + FI 图 decode。
#
# 速度/显存取舍（2026-11-16 现场实测）：
#   · prefill_chunk = 1024：2048 的 Marlin 工作区 + 图像 scatter 会把
#     20G 卡压到 vram-guard 拒绝（PoolExhausted）；1024 在 193k prompt
#     实测 1473 t/s，且能稳定跑完整上下文。
#   · max_batch = 1 / gdn_slots = 1：DFlash2 d7 的批 decode 门恒关，
#     多活跃只会翻倍预留；并发请求走引擎队列。
#   · snap_max = 4：单活跃 + 刚收口尾边界；双会话才需要 6。
#   · vram_reserve_mb = 2560：覆盖图执行、warmup、Marlin/图像 scratch。
#
# 卡位按名字子串消费；生产部署建议显式写 UUID。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/int8.toml",
]

[server]
bind = "0.0.0.0:8135"

[parallel]
mode = "tensor"
device = ["3080", "3080"]
tp_ar = "ar2"
tp_ar_f8 = true
tp_comm = "p2p"
tp_vocab_split = true

[model]
path = "../models/bytkim/Qwen3.8-27B-pi-AWQ-INT4"
# W4A8：SM86 INT8 张量核，prefill 显著快于 W4A16
quant = "w4a8"

[runtime]
admission_on_full = "reject"
# 模型 native 上限；再高需要 YaRN
max_seq = 262144
max_batch = 1
# 20G 卡的稳定点；2048 会撞 scratch 预算
prefill_chunk = 1024

[sampling]
# agent 场景避免 greedy 复读；客户端 temperature=0 仍可逐请求回落
mode = "sampling"
temp = 0.7
topk = 20
topp = 0.95
rep_penalty = 1.05

[kernel]
# INT8 主池走专用 P8 核，不使用 FP8→F16 shadow
prefill_shadow = false

[spec]
# TP2 草稿族放行
tp_draft = true
# DFlash2 d7：短/中上下文高 AL 下吞吐最高；长上下文低 AL 可试 --set spec.depth=5
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"

[store]
prefix_cache = true
host_cache_mb = 10240
snap_host_mb = 3072
# 覆盖图执行 + warmup + Marlin/图像 scratch
vram_reserve_mb = 2560

[store.gdn]
gdn_slots = 1
snap_max = 4
snap_msg_delim = ""
snap_msg_recent = 4
snap_session_cap = 20
snap_structural_reserve = 4

[vision]
image_evict = true
