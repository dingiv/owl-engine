# ── 唯二常驻档 ②:双 3080 20G / TP2 / 27B AWQ-INT4 满血档 ─────────────────
#
# 形状:TP2(张量并行)+ 词表切分 + fp8 全 reduce + 融合 AR;
#       prefill = eager + Marlin W4A16;decode = FlashInfer + CUDA graph;
#       投机 = DFlash2 d7(W4A16 草稿,TP2 需 `spec.tp_draft = true`);
#       KV = **int8**(30 系默认);视觉塔开(与 3090 档同形)。
# 2026-11-04 INT8 默认验收：1k/8k 文本绿；视觉 grounding + image_evict
# 36/36、hit@16px 100%；max_seq 262144 boot/池账通过。
#
# 卡位:靠 `parts/hardware/3080-tp2.toml` 的名字子串("3080"×2)去重消费;
#       **禁 CUDA 序号**(本机 nvidia-smi 序 ≠ CUDA 序,数字序会被重解释成混插对)。
#       要钉死物理卡用 UUID:--set parallel.device='["GPU-…","GPU-…"]'
#
# 上下文:262144 = 模型 `max_position_embeddings`(再高要 YaRN,别在这档里改)。
# 与 3090 档的分工:双 3080 吃"长上下文 + 视觉",单 3090 吃"agent 低时延";
# 两档不能同机共驻(3090 对与 3080 对各占各的卡)。
#
# ⚠️ 与单 3090 档同源的已知缺陷:DFlash2 尾批裁剪可让设备核自旋
# (`docs/devlog/serving/spec-tailcap-gpu-spin-立案.md`)。
#
# 2026-10-29:默认主模型切到 `bytkim/Qwen3.8-27B-pi-AWQ-INT4`
# (awq-forge 本地转换,19G,g32-asym,无 MTP;质量门 GSM8K 96.5% vs FP8 97.0%)。
# DFlash 草稿用 **syvai W4A16 int4**(1.19G)——它就是 pi 源 BF16 草稿
# (`bytkim/Qwen3.8-27B-pi-FP8/dflash2`,与 z-lab 件 sha256 逐字节一致)
# 的 GPTQ 量化件(base_model=incoai),不是另一个模型。
# ⚠️ 这个草稿的 conv 并行结构(qkv/gate_up 与 kernel_projection 共享
# 同一份 normed 输入,且 coefficients 同时用于 prepare/finish)使 AWQ
# 的平滑缩放无法折叠——硬做只能退化成 RTN。int4 的正确校准路径就是
# GPTQ(syvai 同源),故不另造 AWQ 草稿。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/hardware/3080-tp2.toml",
  "parts/kernel/fi-graph.toml",
  "parts/pool/int8.toml",
]

[server]
bind = "0.0.0.0:8135"

[model]
path = "../models/bytkim/Qwen3.8-27B-pi-AWQ-INT4"
# **W4A8 主干**(2026-10-27 用户裁决默认;理由与档①同:SM86 INT8 张量核 2×f16)。
# TP2 每 rank 池 4096MiB / 预算 6.37G ⇒ a8 的工作区(≈170MiB/rank)有余量。
# 2026-10-31:a8 M-split 激活尺度修复后,长上下文门 20k × 10/10 通过
# (`docs/devlog/kernels/w4a8-msplit-scales-立案与修复-2026-10-31.md`)。
quant = "w4a8"

[runtime]
keepalive_ms = 1000   # SSE 静默保活(ms;0=关):长 prefill 期间探客户端断流
max_seq = 262144
# **并发上限 2**(2026-11-03 用户裁决:TP2 档默认开双并发)。
# 语义边界(别误解):
# - ✅ 两路请求可以**同时被受理**(各有 turn id / sink / 在 `/debug/queue` 可见),
#   不再在 HTTP permit 上串行等待;同会话仍由会话闸串行。
# - ❌ **设备拍仍串行**:本档 TP2 + DFlash2 + 选择层 ⇒ `max_batch` 必须 1
#   (合批要求单卡 / spec off),所以 `turns.active` 上限仍是 1,第二路在**引擎队列**
#   里等。真并行不在这档的形状里。
# - 代价:第二路会做准入预留(Strict 地板 = 全 ctx 页);池不够时它**排队**而不是
#   抢第一路的块(活跃块由槽引用计数保护,逐不动)。
max_concurrency = 2
# 3080 TP2 冷 prefill A/B（2026-10-25，15K/25K/37K）:
#   512  = 1486 / 1446 / 1359 t/s
#   1024 = 1576 / 1521 / 1454 t/s
#   2048 = 1605 / 1543 / 1477 t/s  ← 当前档
# 只改本 TP2 档;3090 档 2026-10-27 亦提到 2048(单卡实测 +3~5%)。
# 尾块合并取 0:同 full.toml 注 —— 合并会把块撑到 2560,工作区跟着变大。
prefill_chunk = 2048
prefill_tail_merge = 0
# pi 不发 session 键:隐式会话 0 让工具轮/图片删除有稳定会话;
# 跨会话前缀仍由内容寻址缓存兜底(实测 49k prompt 99.9% 命中)。
implicit_session = true

[sampling]
# GUI agent 联调：打破 greedy 复读；客户端显式 temperature=0 仍可逐请求回落贪心。
# 2026-10-30 定调（复读立案）：**greedy = 27B instruct 的复读吸引子**，本档走采样。
# temp 0.3 → **0.7**：0.3 在末层 logit gap ≥2 处 p(top1) ≈ 0.999，实际等同贪心
# （真机复读探测：同一 prompt 的 6-gram 重复峰值 temp 0=13 / 0.3=5 / 1.0=3）；
# 0.7 位于「0.3（近贪心）」与「checkpoint 自带 1.0」之间，留 agent 稳定性。
mode = "sampling"
temp = 0.7
topk = 20
topp = 0.95
# **开启 1.05**（2026-10-31 用户裁决，基于下面的 A/B 事实）。
#
# 为何以前不敢开（已作废）：2026-10-26 **之前** rep>1 会把候选快路关掉 ⇒ 回读整行
# logits（52.2 vs 82.4 t/s）。**2026-10-26 之后**惩罚已下沉到设备端 top-32
# **选候选之前**，`use_cand` 不再以 rep_penalty 为门（exec/spec.rs:174 /
# exec/phases.rs:1081）⇒ 热路径零回退。
#
# **2026-10-31 真机 A/B（单卡 3090 / w4a8 / spec d7 / 256 tok，两次独立 boot）**：
#   rep=1.00 → 采样档 66.8 / 66.9 / 75.0 t/s；greedy 89.5 / 89.1
#   rep=1.05 → 采样档 68.0 / 64.3 / 68.1 t/s；greedy 89.6 / 89.7
#   ⇒ **解码无回归**(差异在方差内)；AL 2.82 → 2.67（符合预期，草稿也被惩罚）。
#
# ⚠️ **但它不是跳轮复读的解**：生产 17 轮逐字重复（/debug/agent seq29–45）**就发生在
# temp=0.3 采样档上** ⇒ 固定点靠采样/惩罚治不了，需服务层“重复 tool_call”守卫
# （已落 `apps/server/src/repeat_guard.rs`，当前形态 = 只可见 + WARN）。
#
# ⚠️ greedy 档下 rep_penalty **本就不生效**（`act.sampler_on=false` ⇒ 历史槽填哨兵）。
rep_penalty = 1.05

[kernel]
# INT8 主池没有 FP8→F16 shadow（`prefill_shadow` 仅 kv_fp8 有效；
# 配置面会拒 `prefill_shadow && !kv_fp8`）。INT8 prefill 走专用 P8 核，
# 不再需要 fp8 时代的 512 MiB/rank f16 staging。
prefill_shadow = false

[spec]
# TP2 草稿族放行(缺它 = tp.rs 装配期响亮拒)
tp_draft = true
# 深度阶梯**未启用**（2026-11-03 实测）：DFlash2 要切档就得给每个 depth 各捕获
# 一套 propose/fold 图族（boot 门：`depth=3 图族不完整 fold 1/3 propose 0/4`）——
# 20G 卡上多一套图族的显存与捕获代价待评估 ⇒ 暂留单档 d7。
# 2026-10-29 用户指定草稿口径 = INT4(syvai W4A16,GPTQ):
# 与 pi 源 BF16 草稿同源(incoai),1.19G/TP2 = 0.6G/卡。
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"

[pool]
# 生产级默认:关键特性全开(非"看着省一点"的保守档)。
# TP2 双卡各 20G:快照 2 槽 + 宿主 3G(pi agent 无 session,
# 前缀缓存必须开;宿主预算避免 Transient 快照顶掉 durable 边界)。
# 27B agent prompt 实测 49k token 二次命中 99.9%(TTFT 37.9s→0.21s)。
# **快照设备槽 3 个**(2026-11-03 随并发 2 上调;2026-10-31 前是 2)。
# 规律:`snap_max ≥ max_concurrency + 1` —— 每个活跃 turn 的 `last_snap` 各占一格
# (受 `snap_guard` 保护,逐不动),再留一格给"刚收口那条链的尾边界"。
# 只有 2 格时,新一轮的第一个边界拍摄就会把上一轮刚发布的边界**挤到宿主**
# (实测 `尾快照层=Host`,复用虽 100% 但要回灌 159MB/轮);3 格时它留在设备。
# 显存代价 = +1 张 × 159MB(TP2 两 rank 各 79.6MB);boot 余量 ~3.2GiB/card,够。
snap_max = 3
# GDN 状态格 = 每活跃 turn 一格;boot 门要求 `gdn_slots ≥ max_concurrency`,
# 否则拒启(`parts/pool/fp8.toml` 里是 1 ⇒ 本档显式覆盖成 2)。
gdn_slots = 2
prefix_cache = true
snap_host_mb = 3072
host_cache_mb = 10240
vram_reserve_mb = 512
# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
transient_reserve_mb = 1024
# 图像前缀无感删除(leave-gap:删后不转 K、保留位置洞)。
image_evict = true
# 消息边界快照:pi 每轮重发全历史;与 3090 生产档同形。
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0
