# ── 双 3080 20G / TP2 / Qwen3.8-27B AWQ-INT4 ─────────────────────────────
#
# 目标：262144 上下文 + 视觉 + 前缀缓存 + DFlash2 d7 同时可用。
# 形状：W4A8 主干 · INT8 KV · TP2 + 词表切分 · eager prefill + FI 图 decode。
#
# 满池姿态（2026-11-18 现场实测）：
#   · max_concurrency=2 / snap_max=6：池按 cap−prefill 瞬态拉满，
#     双会话共享；单请求上限仍是模型 native 262144。
#   · prefill_chunk = 1024：2048 的 Marlin 工作区 + 图像 scatter 会把
#     20G 卡压到 vram-guard 拒绝（PoolExhausted）。
#   · vram_activation_reserve 实测：256 → 8k prompt 差 ~5MiB 拒发；
#     512 → 64k prompt 在 60MiB alloc OOM；1024 → 200k prompt 通过。
#     1024 是当前能跑长 prefill 的最低垫，别再往下砍。
#
# 卡位按名字子串消费；生产部署建议显式写 UUID。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/int8.toml",
]

[server]
bind = "0.0.0.0:8135"

[parallel]
mode = "tensor"
device = ["3080", "3080"]
tp_ar = "ar2"
tp_ar_f8 = true
tp_comm = "p2p"
tp_vocab_split = true

[model]
path = "../models/bytkim/Qwen3.8-27B-pi-AWQ-INT4"
# W4A8：SM86 INT8 张量核，prefill 显著快于 W4A16
quant = "w4a8"

[runtime]
admission_on_full = "reject"
# 模型 native 上限；再高需要 YaRN
max_context_length = 262144
max_concurrency = 2
# 20G 卡的稳定点；2048 会撞 scratch 预算
prefill_chunk = 1024

[sampling]
# agent 场景避免 greedy 复读；客户端 temperature=0 仍可逐请求回落
mode = "sampling"
temp = 0.7
topk = 20
topp = 0.95
rep_penalty = 1.05

[kernel]
# INT8 主池走专用 P8 核，不使用 FP8→F16 shadow
prefill_shadow = false

[spec]
# TP2 草稿族放行
tp_draft = true
# DFlash2 d7：短/中上下文高 AL 下吞吐最高；长上下文低 AL 可试 --set spec.depth=5
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"

[store]
# 前缀缓存是默认行为（正常服务恒开；仅 ablation/reuse=off 才关）
# 显式钉死显存预算：全部给 KV 池
vram_budget = 1.0
ram_pool_size = 10240
snap_host_mb = 3072
# 满池：池 = cap−prefill瞬态；本垫是长 prefill 的实测下限（见文件头）
vram_activation_reserve = 1024

[store.gdn]
snap_max = 6
snap_msg_delim = ""
snap_session_cap = 30
snap_tail = 12

[vision]
image_evict = true
