# owl 意图档 `tp27b-3080-vlm-184k`(2×3080 20G / TP2 / 27B + **视觉塔**,spec off)
#
# 2026-10-20 视觉接线 V1–V4 的**无投机对照档**:
#   · 视觉塔装载 + 图像 prefill(TP2 两 rank 各备一份塔输出)
#   · OpenAI `image_url`(data URL;Qwen2VL 预处理 2×2 块序)
#   · 单图/单会话;**spec off**——图像 × DFlash2 已由 V5 接到
#     `tp27b-3080-184k`;本档保留作无草稿对照/显存更宽裕的部署姿势。
#
# 启动(本档已带 bind / tp_ordinals;换机器请改):
#   server -p profiles/tp27b-3080-vlm-184k.toml

# --- 以下为**完整档**（2026-10-21）：所有字段显式声明，缺一个就拒启。
# 生成方式：server -p <旧档> --print-config > <新档>.toml

[runtime]
bind = "127.0.0.1:8138"
tp_ordinals = [
    2,
    3,
]
tp_push = false
tp_ar_f8 = false
tp_vocab_split = false
tp_ar_fused = false
gpu_min_free_ratio = 0.9
max_seq = 184320
prefill_chunk = 1024
max_batch = 1
prefill_tail_merge = 0
slice_every = 0
slice_tokens = 0
newcomer_min_tokens = 4096
min_gen_tokens = 256
reserve_pages = 0
max_queue = 0

[model]
kind = "awq27b"
vision = true
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
name = "qwen3.8-27b"
dflash2_dir = "/home/div/Documents/codes/models/syvai/Qwen3.8-27B-DFlash2-W4A16"
head_quant = "rtn-int4-g32"
quant = "w4a16"

[model.rope]
yarn_factor = 1.0
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

[pool]
pool_tokens = 184320
gdn_slots = 1
prefill_align_tail = true
snap_decode_stride = 1
prefix_cache_share = 0.5
snap_max = 0
host_cache_mb = 0
pool_cap_mb = 256
snap_host_mb = 0
disk_cache_mb = 0
snap_disk_mb = 0
disk_dir = ""
vram_target = 0.99
vram_reserve_mb = 256
prefix_cache = false

[kvmem]
select_decode = false
select_partial = false
index = false
workspace_per_req = 2240
select_sink = 2
select_recent = 4
recall_every = 1
coverage_probe = false
analyze_at_ctx = 0
evict_policy = "lru"
pool_overcommit = false

[spec]
draft = "auto"
depth = 0
dumb = false
draft_kv_fp8 = false
notaps = false
tapdecl = false
tp_draft = false
degrade_after = 6
probe_every = 8

[sampling]
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.949999988079071
rep_penalty = 1.0

[load]
verify = false
debug_tap = false
staging_mb = 128
repack = "auto"
dump = false

[dispatch]
# 单键臂(2026-10-21 合并:旧 verify_v2/verify_fi/verify_xqa + decode_fi/decode_xqa)
verify_arm = "v2"
decode_arm = "v2"
qkv_fuse = true
prefill_split = false
force_naive_prefill = false
fi_plan_restore = true
fi_cuda_graph = false
xqa_prefill = false
fi_min_tokens = 1
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
kv_fp8 = true
resolve_trace = false
host_argmax = false
ts_probe = false
tag_wildcard = false

[probes]
step_profile = false
perf_level = "host"
gdn_dump = false
debug = false
prefill_cksum = false
fact_probe = false
trace_gate = false
dflash_probe = false
propose_eager = false
dflash_eager = false
dflash_noencode = false
dflash_dumb = false
gdn_dump_all = false
pf_bisect = false
pf_fin_check = false
raw_completion = false
prompt_dump = false
gdn_dbg = false
pf_fence = false
step_gate = "off"
step_gate_ms = 0
step_gate_us = 0
step_gate_every = 0

[cuda]
srv_timing = false
cap_prof = false
launch_sync = false
sync_mask = 0
launch_time = false
d2h_prof = false
gpu_prof = false
free_legacy = false
trace_ring = 0

[cuda.graph_flags]
upload = false
device_launch = false

[graph]
no_graph = false

[server]
max_concurrency = 1

[agent]
implicit_session = false
default_max_new = 4096
max_new_cap = 8192
parse_tool_calls = true
tool_call_format = "xml"
auto_disable_thinking_with_tools = false
queue_wait_ms = 0

[log]
level = "warn"
tags_allow = []
tags_deny = []
max_mb = 0
keep = 0
timestamp = false
