# owl 档 `qwen38_27b-3090-iq4xs-mtp` —— 27B UD-IQ4_XS + 单文件 NextN MTP 头 / 12k。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8146"

[model]
name = "qwen3.8-27b-gguf-mtp"
path = "/home/div/Documents/codes/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ4_XS.gguf"
format = "gguf"
quant = "iq4"
head_quant = "off"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 12288
max_concurrency = 1

[pool]
pool_tokens = 12288
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 7
draft = "mtp"
draft_kv_fp8 = false
# Windowed-MTP（Phase 0）：草稿读 sink=64 + 最近 4032 tok；target verify 全上下文。
# 8k prompt+输出会跨 8192，min_ctx 取 12288 才真正保 full。
mtp_window = 4032
mtp_sink = 64
mtp_window_min_ctx = 12288
# T1b 自适应 depth：短 ctx 用 d7，长 ctx 回 d3；两档图族 boot 期预捕获。
# 连续 2 窗 tokens/round < adaptive_min_tpr 才只降不升。
adaptive_depth = true
depth_min = 3
depth_switch_ctx = 49152
adaptive_min_tpr = 3.0

[kernel]
kv_fp8 = false
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
