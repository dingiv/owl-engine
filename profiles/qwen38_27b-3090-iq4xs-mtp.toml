# owl 档 `qwen38_27b-3090-iq4xs-mtp` —— 27B UD-IQ4_XS + 单文件 NextN MTP 头 / **216k**
#
# **目标函数(用户裁定 2026-10-21)**:上下文长 > decode 速度 > prefill 速度,但三者
# 必须**均衡**;显存是**硬预算**(池顶满、不留空)。
#
# 形态:fp8 KV(主池 + 草稿链池)+ **原生块 MTP 头**(Q6_K 12 张 + Q8_0 3 张 ≈0.35 GB,
# 非 host 解到 F16 的 0.86 GB)+ 自动池(`pool_tokens` 不写 = max_seq)。
# 实测(3090 Ti 单卡,std 256tok;bench 卷 §M.1–M.5):
#
#   ctx    | prefill | decode | TTFT      | 备注
#   512    | 1620    | 101.9  | 0.32 s    | 原生块草稿 +16% vs F16 头
#   100k   |  861    |  51.2  | 94-134 s  | fp8 池
#   198.9k |  441    |  —     | 451 s     | 216k 池(单发实测上限)
#
# ⚠️ 上限口径:`[ctx-max]` 的**算式上限 280k** 只是上界 —— 真机还要扣未入账固定开销
#   (CUDA ctx + FI ws + 图 slab + 碎片 ≈1.6 GiB)+ 每 turn 瞬态(34~300 MiB):
#   **216k ✓ / 220k 差 17 MiB / 224k ✗**;模型自身 cap = 262144(未开 YaRN)。
#   想再大只能降 per_tok(池 f16→fp8 已是)、减草稿池,或上 TP2。
#
# 降档(f16 池更快,代价 ctx 上限 96k):`--set kernel.kv_fp8=false` +
#   `--set runtime.max_seq=98304`;32k/64k 同理只改 max_seq(池自动)。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8146"

[model]
name = "qwen3.8-27b-gguf-mtp"
path = "../models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ4_XS.gguf"
format = "gguf"
quant = "iq4"
head_quant = "off"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 221184
max_concurrency = 1

[pool]
pool_tokens = 0  # **0 = 自动**(= max_seq;父档 full.toml 有值,子档只能显式清零)
gdn_slots = 1
vram_target = 1.0   # 硬预算:不留空(0.99 曾静默禁用治理器)
vram_reserve_mb = 384  # 池后还要留 per-turn 瞬态(34~300 MiB)+ 未入账固定开销(~1.6 GiB)

[spec]
depth = 7
draft = "mtp"
draft_kv_fp8 = true   # 草稿链池 e4m3(2 KiB/token;此前该项对 MTP 无效)
# Windowed-MTP（Phase 0）：草稿读 sink=64 + 最近 4032 tok；target verify 全上下文。
# 8k prompt+输出会跨 8192，min_ctx 取 12288 才真正保 full。
mtp_window = 4032
mtp_sink = 64
mtp_window_min_ctx = 12288
# T1b 自适应 depth：短 ctx 用 d7，长 ctx 回 d3；两档图族 boot 期预捕获。
# 连续 2 窗 tokens/round < adaptive_min_tpr 才只降不升。
adaptive_depth = true
depth_min = 3
depth_switch_ctx = 49152
adaptive_min_tpr = 3.0

[kernel]
kv_fp8 = true   # 主池 e4m3:32 KiB/token ⇒ 216k 的容量前提
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
