# ============================================================================
# owl **默认档**（2026-10-21 立）
#
# 不带 `-p` 启动时 server 自动加载本档（见 apps/server/src/config.rs 的
# `find_default_profile`）。它有两条硬要求，别再退回"用户缺省"：
#   ① **写全站点事实**（模型路径 / 端口 / 卡位）—— 不再靠代码缺省路径；
#   ② **写最佳生产点**（FP8 KV / DFlash2 d7 / FI 单图 / int8 头 / 词表切 /
#      AR 融合 / 262k 全设备池）—— 裸缺省是 4k + F16 KV + 无投机 + 无图，
#      那是"能跑"，不是"最优"。
#
# 换硬件/换端口**不要改本档**：用站点层覆盖，保持默认档的单一事实源：
#   server --site my-site.toml
#   server --set runtime.tp_ordinals=[0,1] --set runtime.bind=127.0.0.1:8139
# 单卡 3090 档示例见 profiles/awq27b-3090-max.toml（意图式，可对照）。
#
# 显存账（每 rank，实测）：Weight 10.44G + Pool 6.75G（主 fp8 4G + 草稿 BF16
# 2.5G）+ Unclassified 0.87G + GDN/图 0.16G ⇒ used ≈ 19.19G / 20.48G。
# ============================================================================
[model]
name = "qwen3.8-27b"
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
dflash2_dir = "/home/div/Documents/codes/models/syvai/Qwen3.8-27B-DFlash2-W4A16"
kind = "awq27b"
# W4A16：权重 AWQ-INT4(g32 asym) + 激活 f16（W4A8 质量门未过档）
quant = "w4a16"
# lm_head int8 per-row（P1.5-a）：decode −4.3%（3080 对实测）；回退 = "off"
head_quant = "rtn-int8-row"
# 视觉塔装载（文本主干共享同一份 Arc）
vision = true

[runtime]
# 2×RTX3080 20G；换机器只改这一行（或走 --site / --set）
tp_ordinals = [2, 3]
bind = "127.0.0.1:8138"
max_seq = 262144
# 大块摊薄 host 税（TP2 无 prefill 桶）
prefill_chunk = 512
# 词表切（P1.1）：半表 124160×2，逐步 max|Δ|=0，token 逐位相同；decode +3.4%
tp_vocab_split = true
# AR v1 两核融合（§11.2）：+2.4%；0.8B tp_g8_gate L1 逐位相同
tp_ar_fused = true

[spec]
# DFlash2 深度 7（草稿双 rank 必须显式开）
depth = 7
tp_draft = true

[pool]
# 单会话：一格 GDN / 一条快照
gdn_slots = 1
snap_max = 1
# 长 ctx 生产服务：池按全上下文给 ⇒ 前缀缓存关
prefix_cache = false
pool_tokens = 262144
# 贴顶（留 256 MiB 守卫）；无宿主腿
vram_target = 0.99
vram_reserve_mb = 256
host_cache_mb = 0
snap_host_mb = 0

[dispatch]
# 主 KV e4m3 池（262k 的唯一解）；准入走配置派生的 tag filter
kv_fp8 = true
prefill_split = false

[sampling]
# greedy 是**测速/恒等门**口径；对话场景按需 --set sampling.mode=...
mode = "greedy"

[server]
max_concurrency = 1
