# ── 常驻档 ③:单张 3090 Ti / 27B **GGUF UD-IQ4_XS** + DFlash2 d7(文本档)─────
#
# 为什么是 IQ4_XS 而不是 Q4_K_M(2026-10-27 实测,GPU2 独占,冷 boot):
#   · **Q4_K_M 19.0GB 里 38% 字节是 Q8_0**,比 AWQ-INT4(15.2GB)还重 3.8GB ⇒
#     什么也没省下,而速度已经被同卡的 a8 AWQ 全面超过(prefill 1679 vs 2174)
#     ⇒ **不作为常驻档**(留 measurement 档对照)。
#   · **UD-IQ4_XS 14.3GB**,比 Q4_K_M 轻 4.7GB ⇒ 同一张 24G 卡上
#     **上下文 57k → 192k(3.4×)**,而 prefill 几乎不变。
#
# 本档实测(单 3090 / greedy / chunk 2048 / DFlash2 d7):
#   ctx        prefill      decode     TTFT
#   4k         1646 t/s     135 t/s     2.49 s
#   8k         1681 t/s     127 t/s     4.88 s
#   64k        1296 t/s      77 t/s     50.6 s
#   128k        969 t/s      41 t/s    135.3 s
#   (128k 请求零拒发,boot 余量 2.2GB;cap = 246105,本档取 80%)
#
# 定位:
#   · **本机唯一能开到 168k 的档**(AWQ 档 a8 后只有 57k;TP2 档 262k 但要两张卡);
#   · **视觉已接**:GGUF 主文件不含视觉塔,用同源 `mmproj-F16.gguf`(0.9GB)。
#     开视觉前 192k / 开视觉后 **168k**(cap 218457 的 79%,128k prompt 零拒发);
#     烟雾实测:三色横带图 ⇒ 回答"红、绿、蓝"正确。
#   · prefill 比 a8 AWQ 慢 24%,换的是 3.4× 上下文 —— 长文/大 prompt 用本档,
#     短 prompt 低时延用档①(8134)。
extends = [
  "full.toml",
  "parts/model/27b-gguf-iq4xs.toml",
  "parts/hardware/3090-single.toml",
  "parts/kernel/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[server]
# 与档①(8134 AWQ 单 3090)/档②(8135 双 3080 TP2)并存:
# 本机有两张 3090 Ti ⇒ 8134 与 8136 各占一张(device 按"名字子串 + 空闲占比"
# 自动挑;先起谁谁先占).要钉死物理卡用 UUID:
#   --set parallel.device='["GPU-…"]'
bind = "127.0.0.1:8136"

[model]
# **视觉塔**:GGUF 主干不含 `model.visual.*`,必须指 mmproj。
# F16 版(0.9GB)与 IQ4_XS 同为 unsloth 系(视觉塔精度不随主干量化)。
# ⚠️ 它吃 0.9GB ⇒ ctx 从 192k 收到 168k(见 [runtime] 注)。
vision = true
vision_path = "../models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"

[runtime]
# 172032 = 5376 页(boot 报的 cap = 218457 的 79%,已含 0.9GB 视觉塔)。
# 实测 64k / 128k prompt 零拒发,余量 1.79GB;196608 时 64k 就撞 68MiB 硬预算。
max_seq = 172032
max_concurrency = 1
# 与档①同款:GGUF 的 prefill 走 MMQ2,块越大发射越少(实测 512→2048 +8~15%,
# 4096 在 8k prompt 上会 prefill 边界降级 ⇒ 2048 是安全上限)。
prefill_chunk = 2048
prefill_tail_merge = 0
# pi 不发 session 键:隐式会话 0 让工具轮有稳定会话;跨轮前缀由内容寻址缓存兜底。
implicit_session = true

[spec]
# DFlash2 d7:草稿仍是 W4A16 pack-quantized 检查点(与主干格式无关;
# tag filter 在 depth>0 + draft_path 时会同时放行 QUANT_GGUF 与 W4A16/AWQ)。
depth = 7
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"
lookup = true

[pool]
# snap1 + reserve256:给 2048 块的瞬态激活留余量(见 max_seq 注)
snap_max = 1
prefix_cache = true
vram_reserve_mb = 256
# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
transient_reserve_mb = 1024
host_cache_mb = 10240
# 快照腿宿主面关:本档 snap_max=1,槽一换就要「下沉→再 land」⇒ 会撞
# store 的「块已在宿主层」不变量(实测一次,同 2026-10-24 粘性毒化案族)。
# 只留设备侧 1 槽:边界快照被换掉就是丢了(单会话 + 活链前缀缓存够用)。
snap_host_mb = 0
# agent 消息边界快照(delim 空 = 模型 ChatFormat.im_open)
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0
