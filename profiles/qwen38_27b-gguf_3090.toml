# ── 单 3090 Ti / Qwen3.8-27B GGUF UD-IQ4_XS + 视觉 ───────────────────────
#
# 长上下文文本档：IQ4_XS 14.3GB，比 AWQ 档换到更大 ctx。
# 视觉塔用同源 mmproj-F16；INT8 KV；DFlash2 d7。
extends = [
  "full.toml",
  "parts/model/27b-gguf-iq4xs.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/int8.toml",
]

[server]
bind = "0.0.0.0:8137"

[parallel]
mode = "single"
device = ["3090"]

[runtime]
admission_on_full = "reject"
# 含 0.9GB 视觉塔后的稳定点（cap 约 218k 的 79%）
max_context_length = 172032
max_concurrency = 1
prefill_chunk = 2048

[spec]
depth = 7
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"
lookup = true

[store]
# 前缀缓存是默认行为（正常服务恒开；仅 ablation/reuse=off 才关）
# 显式钉死显存预算：全部给 KV 池
vram_budget = 1.0
vram_activation_reserve = 714
ram_pool_size = 10240
# 单槽快照；宿主面默认关闭，避免「下沉后再 land」撞块层不变量

[store.gdn]
snap_device_slots = 1
snap_msg_delim = ""
snap_session_cap = 4
snap_tail_keep = 2

[vision]
enabled = true
path = "../models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
