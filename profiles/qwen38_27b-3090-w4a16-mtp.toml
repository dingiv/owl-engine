# owl 档 `qwen38_27b-3090-w4a16-mtp` —— 3090 Ti 单卡 27B AWQ + 检查点自带 MTP 头 / 16k。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8140"

[model]
name = "qwen3.8-27b"
path = "../models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
format = "awq"
quant = "w4a16"
head_quant = "rtn-int4-g32"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
pool_tokens = 16896
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 3
draft = "mtp"
draft_kv_fp8 = false
# Windowed-MTP (Phase 0;2026-10-21): 草稿读 sink=64 + 最近 4032 tok。
# target verify 仍全上下文；--set spec.mtp_window=0 可回退 full。
# 实测 64k: MATH decode +8.1% / AL -4.8%；DOCS 56.8k decode +18.5% / AL +18.9%。
mtp_window = 4032
mtp_sink = 64
# 8k d7 实测 window=4032 会伤 AL；<8192 保 full。
mtp_window_min_ctx = 12288

[kernel]
kv_fp8 = true
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
