# ── 单 3090 Ti / Qwen3.8-27B GGUF UD-IQ3_S + 视觉 ────────────────────────
#
# 极限上下文档：IQ3_S 12.0GB，ctx 可到 224k；代价是比 IQ4 慢约 13%、
# 3-bit 质量低一档。与 IQ4 档共用 8137，二选一。
# 例外：3-bit 主干对 INT8 KV 的 1k needle 敏感，本档保持 FP8 KV。
extends = [
  "full.toml",
  "parts/model/27b-gguf-iq3s.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[server]
bind = "0.0.0.0:8137"

[parallel]
mode = "single"
device = ["3090"]

[runtime]
admission_on_full = "reject"
# 含 0.9GB 视觉塔后的稳定点（cap 约 286k 的 80%）
max_context_length = 229376
max_concurrency = 1
prefill_chunk = 2048

[spec]
depth = 7
draft_path = "../models/syvai/Qwen3.8-27B-DFlash2-W4A16"
lookup = true

[store]
# 前缀缓存是默认行为（正常服务恒开；仅 ablation/reuse=off 才关）
# 显式钉死显存预算：全部给 KV 池
vram_budget = 1.0
vram_activation_reserve = 714
ram_pool_size = 10240

[store.gdn]
snap_max = 1
snap_msg_delim = ""
snap_session_cap = 4
snap_tail = 2

[vision]
enabled = true
path = "../models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
