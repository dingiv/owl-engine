# ============================================================================
# owl 引擎预设档 `gguf27b` —— GGUF 单卡档(27B Q4_K_M · 3090 Ti 24G)
# ============================================================================
#
# 靶位(用户档里给 `[model] dir`):
#   models/ggml-org/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
#   17.66 GiB / 851 张 / 混型(Q4_K 193 · Q8_0 288 · Q6_K 17 · F32 353)
#   untied(`output.weight` 在场)+ 64 层(16 full attn + 48 GDN)
#
# 起机:
#   CUDA_VISIBLE_DEVICES=GPU-<3090Ti 的 UUID> \
#     target/release/server -p profiles/legacy/gguf27b.toml <用户档.toml>
#   # 用户档只写 [model] dir/name + [runtime] device/bind 即可
#
# 测速(统一口径 = 工作区 `llm_speedtest`,与 vLLM / sglang / llama.cpp 可比):
#   cd packages/llm_speedtest && uv run cli \
#     --api-url http://127.0.0.1:8139/v1/chat/completions \
#     --model Qwen3.8-27B-Q4_K_M --flavor std
#
# ── 本档实测(2026-10-19;单张 3090 Ti 41:00.0;std 五点三轮)──────────────
#   prefill **1778.3 t/s**(512/1713 · 1024/1841 · 2048/~1800 · 4096/~1790 · 8192/1770)
#   TTFT@8192 **4620 ms** · decode **36.5 t/s**
#   同工具对照(同卡):llama.cpp 1265/1383ms→6356 · vLLM AWQ-W4A16 1381 ·
#                     owl AWQ-W4A16 1353 · owl AWQ-W4A8 2266
#   ⇒ prefill 领先 llama.cpp **+40%**;decode 落后它 12%(当前优化对象)
#
# ── 口径与纪律 ──────────────────────────────────────────────────────────
# · `allowed_ops` 已退役(2026-10-20):准入由配置派生 tag filter 自动完成
#   (`quant.gguf` + `kv.main.*` + feature facets);不再手抄核名清单。
# · `prefill_chunk` 维持 **1024**(历史生产口径;改它 = 换测速靶位)。阶梯实测
#   (仅换本旋钮):1024/964 · 2048/1020 · 4096/1059 · 8192/1067 —— 收益来自
#   "每 chunk 解一遍 17.7 GB 权重"被摊薄;**要抬它须与 prefill 桶阶梯成对**
#   (`prefill_plan::ladder` 封顶 1024,超了掉 eager;设计 §20.7)。
# · 池 = 全 ctx 常驻(单卡 24G:权重 17.7 + KV ~2.1 + 图/状态 ~1.2)。
#   别再走宿主下沉(4B 测速档的教训见 `gguf4b.toml`)。
#   **要 262k 长上下文 + KVMem 虚拟化,用 `gguf27b-262k` 档**(设备池只留工作集,
#   全量 KV 在宿主;2026-10-20 联调定档,实测 258k 单跑 190 s,见设计 §二十三)。
# · 前缀缓存**关**(对拍/测速口径;要长会话复用请开并抬 `host_cache_mb`)。
# ============================================================================

[model]
kind = "gguf"

[runtime]
bind = "127.0.0.1:8139"
# 27B:池 = 全 ctx 常驻(单卡 24G:权重 17.7 + KV 1G@32k + 状态/图 ~0.8 ⇒ 留足)
max_seq = 32768
prefill_chunk = 1024

[pool]
# 池 = max_seq(全 ctx 常驻)
pool_tokens = 32768
gdn_slots = 1
snap_max = 2
host_cache_mb = 512
snap_host_mb = 256
# 对拍/测速口径:关前缀缓存(要长会话复用请打开并抬 `host_cache_mb`)
prefix_cache = false

[server]
# `gdn_slots = 1` ⇒ 并发上限必须 = 1
max_concurrency = 1

[sampling]
# 测速口径:greedy(与 std 工具的 pp=0/fp=0 一致;OOD 随机词池易早停,调采样请显式覆写)
mode = "greedy"

[dispatch]
# **GDN prefill 臂 = chunked(T 并行分块 delta-rule;W-2g)**
#
# 缺省 `gdn_chunked = false` 走 `varlen` 顺序扫描(2.42 ms/层 @T=1024)⇒ 占 prefill
# 的 18%;分块臂 **0.65 ms/层** ⇒ std avg 1504.7 → **1778.3(+18.2%)**、
# TTFT@8192 5465 → **4620 ms**,decode 不动。AWQ 生产档(`awq27b-262k/-kvmem`)
# 早就开着它 —— GGUF 档此前是**漏配**,不是代码问题。
# 正确性门:`gdn_chunked_matches_varlen_fn_level`(与 varlen 臂逐值)+
# `gdn_chunked_golden`(分阶段金标)+ `gdn_chunked_nt_decomposition_identity`。
# 注:白名单档需要多一条 `gdn_chunked_delta_rule_fwd`(本档无白名单)。
gdn_chunked = true

[kvmem]
# 非虚拟化档(池 = 全 ctx 常驻;不做部分驻留/选择解码)
select_decode = false
select_partial = false
index = false
