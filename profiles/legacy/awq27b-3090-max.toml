# owl 预设档 `awq27b-3090-max`(单张 3090 Ti / 24GB,W4A16 **满血档**)
#
# 目标:单卡、**不用 KVMem**(无选择层/无宿主/无磁盘 KV 腿)、**最大上下文**、
#       prefill 与 decode 都吃满已定谳的加速路径。
#
# ── 这个档开的是什么(全是已过门/已定谳的优化,非实验面) ──────────────
#   · FP8 KV 池(容量 ×2 + FI 读核;质量与生产 spec-dflash 同口径)
#   · lm_head int4 g32(`rtn-int4-g32`;质量门已过,decode 头部 GEMM 减半)
#   · GDN chunked 五核(prefill 大 T 5.5×;形状门自动回落,小 T 不受影响)
#   · FI 单图 decode(`fi_plan_bake` 上界 + 窗外刷表)
#   · prefill 尾块合并(消灭 ~250ms/chunk 的固定宿主税)
#   · qkv 融合 / GDN decode 融合 D1-v2 / 页对齐 / 生成段边界快照(均已是缺省)
#
# ── 这个档**故意不开**什么(都有明确理由) ──────────────────────────────
#   · `[kvmem]` 全线关:池 ≥ 上下文,不需要选择层/下沉/回灌(开了是纯开销)
#   · `[pool].host_cache_mb = 0`:不超卖,宿主 **KV** 腿无意义
#     (状态快照腿 `snap_host_mb` 例外:只放 GDN 快照,纯 host RAM,不是 KVMem)
#   · `[runtime].max_batch = 1`:单会话最大上下文;合批档另立(见 b5.1)
#   · `[spec]`:投机解码会把每 token 的 KV 账 +20KB(BF16 草稿池)⇒ 上下文
#     直接腰斩;要 decode 投机请用 `spec-dflash`(短 ctx)或另立 spec 档
#
# ── 24GB 的账(改数先看这张) ──────────────────────────────────────────
#   23.60 GiB 卡总 = ~19.2 权重/运行底价(含 int4 头)+ ~1.1 fixed_after
#                  + 激活面(chunk 1024)+ 池 + 守卫余量
#   FP8 KV = 32 KiB/token ⇒ 96k tok ≈ 3.0 GiB;112k ≈ 3.5 GiB。
#   本档给 131072(128k)留激活/守卫余量:实测 144k 可启动且 std 全绿,
#   160k 在 ~15 轮后撞 reserve(存量 turn 暂存未回收的泄漏被小余量放大);
#   要再往上把 `max_seq`/`pool_tokens` 同步加(必须相等:本档不超卖),
#   并以启动日志 `[vram-gov]` 与连续请求实测为准。
#
# 需配套:站点档(`testdata/args/base.toml`)给 `[model].dir` 与本机卡位。
[model]
kind = "awq27b"
quant = "w4a16"
# lm_head 现场 RTN int4 g32(质量门已过;decode 头部 GEMM 减半)
head_quant = "rtn-int4-g32"

[runtime]
# 最大上下文(与 pool_tokens 必须相等 —— 不超卖)
max_seq = 131072
# chunk 512 + 尾合并 512:上界 1024(不再受 prefill 桶阶梯约束;桶已退役)。
# 512 的 marlin m 效率略低于 1024,但换来"尾模板(chat 模板 +6 tok)并进
# 前一块、不付 250ms 尾块税"。
prefill_chunk = 512
prefill_tail_merge = 512
# 单会话语义(也避免合批把上下文预算切碎)
max_batch = 1

[pool]
# = max_seq(非超卖档:池必须装得下整条上下文)
pool_tokens = 131072
gdn_slots = 1
# **快照面整体关闭**:前缀复用关(见下),快照无消费方 ⇒ 省 152MiB + 每边界 67ms
snap_max = 0
# 24GB 贴顶:目标 99% + 最小守卫余量(装不下由 boot 响亮拒,不静默夹)
vram_target = 0.99
vram_reserve_mb = 256
# **前缀复用关**(单会话最大上下文档):prefill 边界快照是纯开销
# (实测 8k 请求 ≈ 1.0s ≈ prefill 的 17%);要跨 turn 复用请改 true
# 并给 snap_max ≥ 1。关它同时关掉快照面(无消费方)。
prefix_cache = false
prefix_cache_share = 0.5
host_cache_mb = 0
snap_host_mb = 0

[dispatch]
# FP8 池:容量 ×2 + FI/XQA 读核的前提
kv_fp8 = true
# GDN prefill FLA 五核(大 T;形状门自动回落)
gdn_chunked = true
# FI 单图 decode:上界烘死(0 = 哨兵取 max_seq),表由引擎窗外每步刷
decode_fi = true
fi_cuda_graph = true
fi_plan_bake = 0
fi_plan_restore = false
# 无投机 ⇒ verify 面不建;显式关掉 v2 避免任何预填族歧义
verify_v2 = false
# 生产算子白名单(deny-by-default;本档实际用到的全集)

[kvmem]
# **不用 KVMem**:无选择层 / 无索引 / 无覆盖率探针
select_decode = false
select_partial = false
index = false
coverage_probe = false

[sampling]
# 测速/恒等门口径;要采样质量请用请求级 temperature(服务面支持)
mode = "greedy"

[server]
# 单会话语义(gdn_slots = 1 ⇒ validate 要求 max_concurrency ≤ 1)
max_concurrency = 1
