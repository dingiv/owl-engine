# owl 档 `qwen38_27b-3090-iq4-mtp` —— 27B AWQ 主干 + 外部 GGUF MTP 头 / 16k。
extends = ["../full.toml"]

[server]
bind = "127.0.0.1:8141"

[model]
name = "qwen3.8-27b-awq+gguf-mtp"
path = "../models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
format = "awq"
quant = "w4a16"
head_quant = "rtn-int8-row"
mtp_dir = "../models/unsloth/Qwen3.8-27B-GGUF/MTP/mtp-Qwen3.8-27B-Q4_0.gguf"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
kv_fp8 = true
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 3
draft = "mtp"
draft_kv_fp8 = false

[kernel]
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
