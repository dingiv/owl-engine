# GGUF × KVMem 论文量级 execution view：Qwen3.8-27B Q4_K_M，单 3090 Ti。
#
# 目的：按 KVMem 论文的 24GB 消费档口径，把 execution view 做到 ~64K：
#   - FP8 KV（32 KiB/token）⇒ 设备池 ~96K；
#   - workspace_per_req = 65536（2048 页），覆盖 60K 上下文 / 90K 的部分召回。
#   - 24GB 卡上 f16 KV 的 48K 已贴顶；FP8 才能到论文量级。
extends = ["../qwen38_27b-3090-gguf-kvmem.toml"]

[pool]
kv_fp8 = true
vram_reserve_mb = 1024

[kvmem]
workspace_per_req = 65536
