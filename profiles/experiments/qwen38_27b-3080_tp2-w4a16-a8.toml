# owl 预设档 `qwen38_27b-3080_tp2-w4a16-a8` —— W8A8 head 实验档
#
# ⚠️ **诊断/对照档,不推荐生产**:W8A16 TC 已同速且质量更好。
# 只覆盖 head_quant:权重仍是同一个 int8 lm_head,前向额外做 per-token
# int8 激活量化;8-bit 算术走 **SM86 int8 Tensor Core**
