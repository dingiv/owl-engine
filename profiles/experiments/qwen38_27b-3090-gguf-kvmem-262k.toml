# GGUF × KVMem · 262K 档（Qwen3.8-27B Q4_K_M，单 3090 Ti，FP8 KV）
#
# - execution view = 80K（论文 24GB 档口径）
# - 设备池压到 ~85K，其余 KV 落 host（262K fp8 ≈ 8.4 GiB）
# - recall_every = 16：选择/Q 每 16 chunk 一次（32 次），索引每 4 chunk
#   一次（P1 暂存上限 64 页），视图/驻留**每边界**用冻结选择更新 —— 错峰，
#   不把 Q/索引/视图堆到末尾。
extends = ["qwen38_27b-3090-gguf-kvmem-80k.toml"]

[runtime]
max_seq = 262144

[pool]
host_cache_mb = 11264
snap_host_mb = 1024

[kvmem]
workspace_per_req = 81920
recall_every = 16
