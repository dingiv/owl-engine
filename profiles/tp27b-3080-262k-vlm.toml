# owl 常用档 `tp27b-3080-262k-vlm`(2026-10-20)
#
# 2×RTX3080 20G:27B W4A16 · TP2 · **262,144 全设备池** · 视觉塔 · DFlash2 d7。
# 本档是**单文件可复制**的完整配置(不再 extends):复制到任意路径,改
# `[model].dir` / `[runtime].bind` / `[runtime].tp_ordinals`,然后:
#   ./target/release/server -p /path/to/this.toml
#
# 显存账(每 rank,实测):Weight 10.44G + Pool 6.75G(主 fp8 4G + 草稿 BF16 2.5G)
# + Unclassified 0.87G + GDN/图 0.16G ⇒ used ≈ 19.19G / 20.48G,free ≈ 0.9G。
# 视觉塔算子由 `feat.vision` tag + 配置派生 TagFilter 自动放行(无 allowed_ops)。
#

# --- 以下为**完整档**（2026-10-21）：所有字段显式声明，缺一个就拒启。
# 生成方式：server -p <旧档> --print-config > <新档>.toml

[runtime]
bind = "127.0.0.1:8138"
tp_ordinals = [
    2,
    3,
]
tp_push = false
tp_ar_f8 = false
tp_vocab_split = true
tp_ar_fused = true
gpu_min_free_ratio = 0.9
max_seq = 262144
prefill_chunk = 512
max_batch = 1
prefill_tail_merge = 0
slice_every = 0
slice_tokens = 0
newcomer_min_tokens = 4096
min_gen_tokens = 256
reserve_pages = 0
max_queue = 0

[model]
kind = "awq27b"
vision = true
dir = "/home/div/Documents/codes/models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
name = "qwen3.8-27b"
dflash2_dir = "/home/div/Documents/codes/models/syvai/Qwen3.8-27B-DFlash2-W4A16"
head_quant = "rtn-int8-row"
quant = "w4a16"

[model.rope]
yarn_factor = 1.0
original_max = 0
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

[pool]
pool_tokens = 262144
gdn_slots = 1
prefill_align_tail = true
snap_decode_stride = 1
prefix_cache_share = 0.5
snap_max = 1
host_cache_mb = 0
pool_cap_mb = 256
snap_host_mb = 0
disk_cache_mb = 0
snap_disk_mb = 0
disk_dir = ""
vram_target = 0.99
vram_reserve_mb = 256
prefix_cache = false
block_pool_bytes = 0
no_reclaim = false

[kvmem]
select_decode = false
select_partial = false
index = false
workspace_per_req = 2240
select_sink = 2
select_recent = 4
recall_every = 1
coverage_probe = false
analyze_at_ctx = 0
evict_policy = "lru"
pool_overcommit = false

[spec]
depth = 7
dumb = false
draft_kv_fp8 = false
notaps = false
tapdecl = false
tp_draft = true
degrade_after = 6
probe_every = 8

[sampling]
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.949999988079071
rep_penalty = 1.0

[load]
verify = false
debug_tap = false
staging_mb = 128
repack = "auto"
dump = false

[dispatch]
qkv_fuse = true
prefill_split = false
force_naive_prefill = false
verify_v2 = true
fi_plan_restore = true
fi_cuda_graph = false
verify_fi = false
decode_fi = false
verify_xqa = false
decode_xqa = false
xqa_prefill = false
fi_min_tokens = 1
gdn_chunked = true
gdn_scalar = false
gdn_fused_decode = true
gdn_fused_decode_v2 = true
kv_fp8 = true
gguf_tile = true
gguf_cublas = true
gguf_mmq2 = true
gguf_mmq = true
gguf_smem = true
resolve_trace = false
host_argmax = false
ts_probe = false
tag_wildcard = false

[probes]
step_profile = false
perf_level = "host"
gdn_dump = false
debug = false
prefill_cksum = false
fact_probe = false
trace_gate = false
dflash_probe = false
propose_eager = false
dflash_eager = false
dflash_noencode = false
dflash_dumb = false
gdn_dump_all = false
pf_bisect = false
pf_fin_check = false
raw_completion = false
prompt_dump = false
gdn_dbg = false
pf_fence = false
live_diag = false
recon_dbg = false
vram_dbg = false
idx_dbg = false
cov_dump = false
store_hook_dbg = false
pf_taps = false
fi_debug = false
l3_audit = false
gdn_diag = false
gdn_fresh_scratch = false
step_gate = "off"
step_gate_ms = 0
step_gate_us = 0
step_gate_every = 0

[cuda]
srv_timing = false
cap_prof = false
launch_sync = false
sync_mask = 0
launch_time = false
d2h_prof = false
gpu_prof = false
free_legacy = false
