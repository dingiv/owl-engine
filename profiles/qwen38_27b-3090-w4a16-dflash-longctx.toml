# DFlash2 长上下文 AL 扫描档(默认 67k;96k 需 `--set model.embed_quant=i8`)
# (metrics-optimize worktree;2026-10-22)
#
# 目的:把 ctx 阶梯拉长,测 DFlash2 d7 的 AL 随上下文长度的变化,
# 同时保留分相 metrics(spec.round / verify / propose / snap / fold)。
# 几何:16384/16896(生产 DFlash2 档)→ 67584/68096;snap_max 1、前缀缓存关,
# 给 96k KV + 草稿池让显存。
#
# 起服:
#   ./target/release/server -p profiles/qwen38_27b-3090-w4a16-dflash-longctx.toml \
#     --log-level info
# 预检:
#   ./target/release/server -p profiles/qwen38_27b-3090-w4a16-dflash-longctx.toml --check
extends = ["qwen38_27b-3090-w4a16-dflash.toml"]

[runtime]
max_seq = 67584

[pool]
snap_max = 1
prefix_cache = false
host_cache_mb = 0
snap_host_mb = 0
vram_reserve_mb = 512

[server]
bind = "127.0.0.1:8140"

[parallel]
device = ["41:00.0"]
