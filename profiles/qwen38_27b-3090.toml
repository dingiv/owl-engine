# ── 单 3090 Ti / Qwen3.8-27B AWQ-INT4 + 视觉 ───────────────────────────────
#
# 短上下文 / 低时延档：单卡 24G，W4A8 + INT8 KV + DFlash2 d7。
# 全特性稳定点 max_seq=57344；prefill_chunk=2048（单卡实测最优点）。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/feature/fi-graph.toml",
  "parts/pool/int8.toml",
]

[server]
bind = "0.0.0.0:8137"

[parallel]
mode = "single"
device = ["3090"]

[model]
quant = "w4a8"

[kernel]
prefill_shadow = false

[runtime]
admission_on_full = "reject"
max_seq = 57344
prefill_chunk = 2048

[sampling]
# 速度优先；跳轮复读由服务层守卫处理
mode = "greedy"
temp = 1.0
topk = 20
topp = 0.95
rep_penalty = 1.00

[store]
prefix_cache = true
vram_reserve_mb = 970
host_cache_mb = 10240
snap_host_mb = 3072

[store.gdn]
snap_max = 2

[vision]
image_evict = true
