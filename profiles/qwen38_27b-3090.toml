# ── 唯二常驻档 ①:单张 3090 Ti / 27B AWQ-INT4 满血档 ──────────────────────
#
# 形状:prefill = eager + Marlin W4A16;decode = FlashInfer + CUDA graph;
#       投机 = DFlash2 d7(W4A16 草稿);KV = fp8 e4m3;**视觉塔开**;
#       前缀缓存 + 三层账全开 + image_evict(FP8, delta_limit=4)。
#
# **max_seq = 57344 / snap_max = 2 —— 2026-10-27 a8 版全特性稳定点**
# (原 a16 版 63456;换 a8 后显存账变小,见 [runtime] 注)
#
# 24G 卡上:27B + 视觉塔 + DFlash2 d7 + fp8 KV + 前缀缓存 + image_evict
# 全部同时开。fresh boot 驱动余量 >1GiB;前缀缓存饱和后可能短暂出现 N6
# 压力 WARN(功能/删除/缓存实测仍通过)。`image_delete_marked` / GUI 三图
# 窗口均通过。79872 + snap1 是更大 ctx,但驱动余量贴 1GiB 压力地板,
# image_evict 的前缀块会被下沉到 host(`前缀有宿主占位 ⇒ 不吸收`)⇒ 不在
# 生产档保留“看起来更大、实际关键特性失效”的点。
#
# 分工:本档 = agent 低时延短上下文;长上下文/大图窗口由 3080 TP2(262144,
# snap2)承担。池不手写:自动派生自 max_seq。
#
# ⚠️ 已知引擎缺陷(2026-10-24 立案,非本档引入):DFlash2 **尾批裁剪**形状
# (`max_new` 剩余 ≤ depth)会让 verify 以裁后的 T 跑图档 ⇒ **核在设备上自旋**
# (GPU util 恒 100%、主机全 futex 等待),短 `max_new` 请求可整台卡死;
# 2026-10-25 已确定性复现(T=8 正常、T=7 自旋)。
# 现场与判据见 `docs/devlog/serving/spec-tailcap-gpu-spin-立案.md`。
# 规避:功能/恒等门用 `--set spec.depth=0 --set spec.lookup=false`;
# agent 客户端给足 `max_tokens`(pi 用 8192,早停回合不受影响)。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/hardware/3090-single.toml",
  "parts/kernel/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[server]
bind = "127.0.0.1:8134"

[model]
# **W4A8 主干**(2026-10-27 用户裁决默认):激活 per-token int8 × 权重 int4,
# 走 SM86 **INT8 张量核**(W4A16 只能走 f16 核 ⇒ 半率)。实测同卡同二进制:
#   prefill 4k 1334→**2126** / 8k 1311→**2230** t/s(**+59%**),decode 持平
#   (+0.95ms/轮的 a8 verify 税已由 A-1/刀B 压掉大半),TTFT@4k 3.13→1.93 s。
# 质量:非逐字同(int8 激活在近平分处翻 greedy 轨迹),S3 battery −0.95pt、
#   McNemar p≈0.69 不显著 ⇒ 按"统计等价"取舍,见 roadmap 26-10-27 两份台账。
quant = "w4a8"

[runtime]
# ⚠️ a8 的显存体积比 a16 大(marlin 工作区 84MiB×2 + 激活量化缓冲):
# 63.4k 档实测 8k 请求就撞硬预算(拒发 19-34MiB)⇒ 全特性档收到 **57.3k**
# (32k/24k 连发零拒发,余量 1.3GB)。要 63k 就不开 a8(回到 w4a16)。
max_seq = 57344
max_concurrency = 1
# **prefill 块长 2048 / 尾块 0**(2026-10-27 逐档实测,详见 full.toml 注):
# 4k 1320→1360、8k 1308→1358 t/s(+3.3%),32k TTFT 27.9→26.6s;
# 4096 会撞显存硬预算(272MiB 工作区)⇒ 2048 是单卡天花板。
prefill_chunk = 2048
prefill_tail_merge = 0
# pi 不发 session 键:隐式会话 0 让工具轮/图片删除有稳定会话;
# 跨会话前缀仍由内容寻址缓存兜底。
implicit_session = true

[pool]
# 2 槽 = 297MiB:给压力地板(1GiB)留余量,同时覆盖三图窗口的删除快照。
snap_max = 2
prefix_cache = true
vram_reserve_mb = 512
# KV 宿主腿 10GiB:设备池只有 1983 槽(63k ctx),两发长 prompt 就占满;
# 宿主腿让整链下沉(内容不丢)而不是硬拒。4GiB 实测:70k+65k 链装不下
# ⇒ N6 只能逐叶丢(一次一个叶),第三发 27k 前缀回灌时 `槽池耗尽`
# (2026-10-25;旧版还会丢宿主内容 ⇒ 粘性「身份未登记」,已修)。
# 10GiB ≈ 容纳 4 条 63k 链(每条 1983 块)的冷缓存。
host_cache_mb = 10240
snap_host_mb = 3072
# 图像前缀无感删除(leave-gap;snap2 覆盖三图窗口)。
image_evict = true
# agent 消息边界快照:delim 空 = 用模型 ChatFormat.im_open(实测 = 1 token [248045])
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0
