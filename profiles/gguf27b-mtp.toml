# owl 档 `gguf27b-mtp` —— 27B UD-IQ4_XS + 单文件 NextN MTP 头 / 12k。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8146"

[model]
name = "qwen3.8-27b-gguf-mtp"
path = "../models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ4_XS.gguf"
format = "gguf"
quant = "iq4"
head_quant = "off"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 12288
max_concurrency = 1

[pool]
pool_tokens = 12288
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 512

[spec]
depth = 7
draft = "mtp"
draft_kv_fp8 = false

[kernel]
kv_fp8 = false
verify_arm = "fi"
decode_arm = "fi"
fi_plan_bake = true
fi_plan_restore = false
fi_cuda_graph = true
tag_wildcard = false
