# 池组件：FP8 KV + 单会话 GDN。**40/50 系默认池**；30 系默认改用 int8。
# ⚠️ FI/Decode 的 FP8 路径仍 dequant→half（compute 不是 FP8 MMA），
# 存储/带宽收益为主；详见 profiles/README.md。
[pool]
kv_fp8 = true
gdn_slots = 1
# 2026-11-04 收紧(同 int8 池):target=1.0 合法,reserve 仍 256MiB。
vram_target = 1.0
vram_reserve_mb = 256

# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
transient_reserve_mb = 512