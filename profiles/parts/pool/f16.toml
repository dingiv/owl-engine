# 池组件：f16 KV（image-evict / KVMem 长上下文对照）。
[pool]
kv_dtype = "f16"
gdn_slots = 1
# **2026-11-04 收紧(用户裁决:预留太保守)**:f16 per_tok 是 int8/fp8 的 2×,
# 旧档 `target=0.97 + reserve=1024` 在 24G 单卡上等于白扔 708MiB(target)
# + 1GiB(reserve) —— 实测 32k 上下文都挤不进。改为:
#   · target = 1.0(**合法档**:base 直接用驱动 free,reserve 是唯一缓冲);
#   · reserve = 512MiB(池外瞬态实测峰值 20~25MiB/块,512 = 20× 余量)。
vram_target = 1.0
vram_reserve_mb = 512

# 超卖档「池外瞬态余量」MiB(池 = cap − 本值/per_tok;缺省 1024 = 旧硬编码值)
transient_reserve_mb = 512