# 池组件：INT8 KV（K int8 + V packed + per-token/per-page scale）。
#
# 约束（boot 响亮拒）：
#   - hd=256 / page=32 / paged；
#   - spec 已接（2026-11-03 P1：专用 verify 臂，T=depth+1）；
#   - index/coverage/select_decode 已接（KvPageCodec 多态；K 带 Kscale、V 解 packed）；
#   - select_partial 暂拒（INT8 稀疏 prefill 视图未验收）；
#   - image_evict 暂拒（INT8 视觉/m-RoPE prefill 未验收）。
[pool]
kv_fp8 = false
kv_int8 = true
gdn_slots = 1
vram_target = 0.99
vram_reserve_mb = 256
transient_reserve_mb = 1024
