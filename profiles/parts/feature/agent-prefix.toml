# 特性组件：pi/agent 10K 多轮前缀复用（GGUF 单卡）。
# 依赖：prefix_cache=true + snap_max>0；delim 空 = 模型 ChatFormat.im_open。
[runtime]
implicit_session = true

[pool]
prefix_cache = true
snap_max = 4
snap_host_mb = 2048
host_cache_mb = 2048
snap_msg_boundary = true
snap_msg_delim = ""
snap_msg_min_gap = 2048
snap_msg_min_span = 0
