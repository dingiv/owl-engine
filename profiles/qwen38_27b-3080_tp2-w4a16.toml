# 两张 3080 20G / 27B AWQ + 视觉 + DFlash2 d7 / 262k（主生产档）。
extends = [
  "full.toml",
  "parts/model/27b-awq.toml",
  "parts/feature/vision.toml",
  "parts/feature/dflash2-27b.toml",
  "parts/hardware/3080-tp2.toml",
  "parts/kernel/fi-graph.toml",
  "parts/pool/fp8.toml",
]

[server]
bind = "127.0.0.1:8137"

[runtime]
max_seq = 262144
max_concurrency = 1

[spec]
# TP2 草稿族放行（缺它 = tp.rs 装配期响亮拒）
tp_draft = true

[pool]
snap_max = 1
prefix_cache = false
