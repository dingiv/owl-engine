# owl 档 `gguf08b-iq4xs` —— 0.8B GGUF IQ4_XS / 16k(开发档)。
extends = ["full.toml"]

[server]
bind = "127.0.0.1:8148"

[model]
name = "qwen3.5-0.8b-gguf-iq4"
path = "../models/unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-IQ4_XS.gguf"
format = "gguf"
quant = "iq4"
head_quant = "off"

[parallel]
mode = "single"
device = ["42:00.0"]

[runtime]
max_seq = 16384
max_concurrency = 1

[pool]
pool_tokens = 16384
gdn_slots = 8
vram_target = 0.97
vram_reserve_mb = 1024

[kernel]
kv_fp8 = false
verify_arm = "v2"
decode_arm = "v2"
fi_plan_bake = false
fi_plan_restore = true
fi_cuda_graph = false
tag_wildcard = false
