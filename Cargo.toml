[workspace]
members = [
    "crates/graph",
    "crates/comm",
    "crates/kernels",
    "crates/core",
    "crates/backends/cuda",
    "crates/backends/iface",
    "crates/nn",
    "crates/signal",
    "crates/engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
parking_lot = "0.12"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bytemuck = "1.24.0"
llguidance = { version = "1.7", default-features = false, features = ["lark", "referencing", "jsonschema_validation"] }
regex = "1.12.2"
serde_json = "1.0.108"
interprocess = "2.4.4"
tokenizers = { version = "0.21.2", features = ["http"] }
rayon = "1.12.0"
tracing = "0.1.40"
bincode = "1.3.3"
