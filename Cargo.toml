[workspace]
members = [
    "crates/graph",
    "crates/comm",
    "crates/store",
    "crates/macros",
    "crates/kernels",
    "crates/backends/cuda",
    "crates/backends/cpu",
    "crates/models",
    "crates/backends/iface",
    "crates/shared",
    "crates/engine",
    "apps/server",
    "apps/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
parking_lot = "0.12"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bytemuck = "1.24.0"
llguidance = { version = "1.7", default-features = false, features = ["lark", "referencing", "jsonschema_validation"] }
regex = "1.12.2"
# `preserve_order` = `Map` 用 IndexMap 而非 BTreeMap(键序 = 插入序)。
# **不是性能选项而是正确性选项**:提示词面要求与 HF/vLLM 的 Python dict 序
# 逐字节一致(tools schema 的键序会进 prompt);默认 BTreeMap 在**解析时
# 就把键排序** → G0 判据不可能通过(agent 服务面 §7.1)。
serde_json = { version = "1.0.108", features = ["preserve_order"] }
# chat template 渲染(agent 服务面 §3.2):Rust 版 Jinja2。**只加库,不引入
# Python**(PyPI 同名包 minijinja-py 是 PyO3 绑定,明确不用)。
# 默认 feature 已含 builtins(namespace())/macros/debug;
# 额外:json(tojson 原料)/preserve_order(键序=插入序,HF tojson 语义)/loop_controls。
minijinja = { version = "2.24", features = ["json", "preserve_order", "loop_controls"] }
# Jinja2 模板调用 Python str 方法(.split/.startswith/…)的兼容回调
# (实测模板用 5 个,pycompat 全覆盖;见 docs/arch/agent-服务面-设计与施工.md §7.1)
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
interprocess = "2.4.4"
tokenizers = { version = "0.21.2", features = ["http"] }
rayon = "1.12.0"
tracing = "0.1.40"
bincode = "1.3.3"

[profile.dev.package.owl-models]
opt-level = 3

# 测试面热点:CPU mock 档的装载解码逐元素路径(§18)——debug 下实测 53MB/s
# (逐元素+无内联),该 crate 单开优化后回到内存带宽级。只影响本 crate。
[profile.dev.package.owl-cpu]
opt-level = 3

# half 的 f16→f32 软件转换在 debug 下逐元素 ~79ns(实测 769M 元素 = 61s);
# 测试/CPU 档逐元素路径必须带上它一起优化(否则 opt-level 只覆盖调用方,call
# 进未优化的 half 里照样慢)。
[profile.dev.package.half]
opt-level = 3

# **同律扩展到引擎与 store 的逐元素热路**(2026-10-19,A3 定谳):
# 索引采集(`MeanKCollector`)/ Q 面解码(`KvPageFormat::decode_row`)/ 解释器
# 逐节点粘合层全在这两 crates 里。debug(opt-level 0)实测:
#   - 索引采集 **10.6 ms/块**(微基准 0.27 ms/块 ⇒ **40× 差**)
#   - 探针档 prefill 596 tok/s;裸引擎 chunk128 仅 246 tok/s
# 与 `owl-models`/`owl-cpu`/`half` 同一条纪律:凡“逐元素/逐节点”路径,
# 测试档必须带优化(否则探针读数与生产读数不是同一个东西)。
[profile.dev.package.owl-store]
opt-level = 3

[profile.dev.package.owl-engine]
opt-level = 3
