# owl 预设档 `spec-dflash`(27B AWQ-INT4 + DFlash2 d7 生产形状;2026-10-18 精简)
#
# 纪律:档内**只列最优且非缺省**的选项 —— 引擎缺省即最优的一律不复述。
# 站点/部署面(model.dir/dflash2_dir、bind、几何)由配套配置文件给,
# 启动 = `server --flavor spec-dflash <site.toml>`。
# 详尽 why 在各设计卷;此处每键一行来源。

[model]
kind = "awq27b"
# lm_head 装载期现场 RTN int4 g32(marlin kU4);质量门已过
head_quant = "rtn-int4-g32"
# 主干 W4A16(AWQ g32-asym + f16 激活)= 现役最优;W4A8 质量门 S3 过档后改此键
quant = "w4a16"

[runtime]
# 16k ctx;池值 = 产品选择(相对 9472 档:prefill ~−2.5% / decode ~−0.5%)
max_seq = 16384
# **prefill chunk = 1024**(2026-10-19):注意力 T 标度(38.4→44.4 TFLOPS)+ marlin m 效率
# (核时 −11%)双料;实测 std 五点三轮 @8192 1357 → 1358~1378(稳态),曲线更平
# (衰减 −5.3% → −3.9%)。桶阶梯同步 +t1024(否则大块回 eager 白丢桶的宿主税节省)。
# 代价:slab 203 → ~520MiB(GRAPH_SLAB_BUDGET 已 320→640 校准);短档(512)约 −2%。
prefill_chunk = 1024
# 尾块合并:剩余 ≤ 512+本值 ⇒ 本步吃完 —— 消灭与尺寸无关的 ~250ms/chunk 宿主税
# (516 tok TTFT 651→406ms / 8k −4.4% / 32k −1.5%)。块边界变 ⇒ token 级非逐位。
# 缺省 0 = 关;perf-runs/prefill-prof-2026-10-18/REPORT.md
prefill_tail_merge = 1024

[spec]
# 草稿深度 7(降级首探窗口 probe_every 缺省即 8,见 config.rs 的取法)
depth = 7

[graph]
# **prefill 桶图**(M2b/M3;2026-10-19 解禁 —— 桶路已接 `fi_plan_sync`,与单图档
# 的 `fi_plan_bake` 不再互斥;`fi_plan_restore = false` ⇒ 桶回放前由引擎窗外刷表)。
# 实测(单 3090 Ti,std 五点三轮,同二进制唯一差别 = 本键;稳态第 2/3 轮):
#   prefill @8192 **1310.6 → 1358.0(+3.6%)** · TTFT@8192 6252→6034ms(−3.5%)
#   小 ctx +0.5~2.8%;正确性:needle 1.6k/4.9k/7.9k/9.3k 全对 + 17/30 tok 与 eager 逐字同
#   ⚠️ 教训:plan sync 的 `ctx_total` 必须 = **本块真实 ctx**(`base+t`);
#      用 `t_pad` 会在长 ctx(≥~5k)读错 KV(实测 7860 tok 答错、4460 对)
# 代价:图 slab **+203MiB**(总 296.5MiB;GRAPH_SLAB_BUDGET 已校准到 320MiB);
#       桶命中率(27B std 相)~100%(整 512 块);pad > 4 行的尾块自动让位 eager。
# 回退:删本节(或 `prefill_bucket = "off"`)。
prefill_bucket = "geobuckets"

[server]
# 单会话语义:GDN 格锁 1 ⇒ 并发闸门必须 ≤1(validate 拒启)
max_concurrency = 1

[pool]
pool_tokens = 16896   # = ceil(16384/page)+slack(页 32;528 页;≈0.9G)
vram_target = 0.99
vram_reserve_mb = 512
# ⚠️ 2026-10-19 驱动性修复:字段在 `7c5627f`(A 轴收官)已改名
# `gdn_slots` → `gdn_slots`,flavor 文本没跟上 ⇒ `deny_unknown_fields`
# 直接**拒解析**(`预设档清单非空且全部可解析` / `load_基准文件与覆盖文件叠加` 红)。
gdn_slots = 1
# ── **前缀复用三层账**(2026-10-19 容量定档;架构 = store 决策/engine 搬运)──
# ① KV 腿宿主层(`host_cache_mb`):缓存块**下沉**而非丢弃 —— 容量算式
#    `cache_cap = 份额×设备池 + 宿主槽`(住 store:`CachePolicy::Share`);
#    宿主 0 时卸载即丢 ⇒ 复用面只剩设备侧那点(实测 13k 会话只复用到 1.5k tok)。
# ② 份额(`prefix_cache_share`):缓存可占设备池的比例(0.75 ⇒ 528 页里 396 页);
#    再 **+ 宿主槽全额**(跨层索引:沉到宿主的条目仍占名额)。
# ③ 状态腿快照(`snap_max` + `snap_host_mb`):复用要求**边界快照在场**
#    (GDN 态对不上就不能复用)。每条 152 MiB;`snap_host_mb > 0` 让旧快照
#    **下沉**而不是被顶掉 ⇒ `reuse_face` 能回查到更早的边界。
# ④ **生成相位逐页边界快照**(`snap_decode_stride`,缺省 1 = 每页一拍;
#    2026-10-19):spec 轮内用 fold 把 GDN 态回卷到边界拍一张(fold 1.6ms +
#    拍 1.0ms ≈ 2.6ms/边界)⇒ 下一轮复用面 = 链头那个整页(旧状只到 prompt 段末页:
#    实测 512 tok 生成 ⇒ 32/544 = 6% → **544/544 = 100%**,下一轮墙钟 1.39→1.00s)。
#    档分两类(store 政策):**前缀段**边界 = Durable(可下沉宿主,跨会话共享前缀靠它);
#    **生成段**界边 = Transient(**逐出即丢** —— 下沉一条 159 MiB ≈ 208ms,而生成段
#    每 32 tok 就出一条)。逐出优先丢 Transient ⇒ 链头那条永远在设备命中。
# VRAM 账(27B/24G):设备池 528 MiB + 快照 4×152=608 MiB(原 1×152);
# 宿主账:KV 4096 MiB + 状态腿 3072 MiB(与 `[pool].host_cache_mb` 同源校验)。
prefix_cache = true
prefix_cache_share = 0.75
host_cache_mb = 4096
snap_max = 4
snap_host_mb = 3072

[dispatch]
kv_fp8 = true
# 现役臂(2026-10-18 W3–W5 转正):prefill=FI / verify=FI 单图 / decode=FI 单图。
# FI 核留捕获图内,`ctx_total` 烘上界(= 0 哨兵取 max_seq),表由引擎窗外
# 每步/每轮 `fi_plan_sync` 刷精确值 ⇒ 图不烘自携 restore。
verify_fi = true
decode_fi = true
# ⚠️ **`verify_v2 = false` 必配**(2026-10-19 审查定谳):verify 注意力臂顺序 =
# `verify_xqa` → **`verify_v2`(缺省 true!)** → 预填族(FI);不显式关掉 v2,
# 上面那行 `verify_fi = true` **永远轮不到**(boot 自证行"verify=FI(单图)"报的是
# **面登记**,不是臂 —— 现已加 `臂事实` 字段)。
# 实测(生产形,5 轮 @8192):v2 臂 AL=2.33 < 盈亏线 3.09 ⇒ 引擎**正确降级裸 decode**
# (803/805 步!)⇒ decode 38.8 t/s;**FI 臂零降级 ⇒ 87.2 t/s(+125%)**;
# @512:79.1 → 107.3(+36%)。verify 轮时 75ms → 42ms。
verify_v2 = false
fi_cuda_graph = true
fi_plan_bake = 0          # 0 = 哨兵「取 [runtime] max_seq」(改档自动跟随)
fi_plan_restore = false   # 图不烘表 ⇒ host 是表的唯一权威(validate 硬配)
gdn_chunked = true
# 生产算子白名单(P4 硬门,deny-by-default;与 kernels ops::PROD_SPEC_DFLASH
# 逐项一致,由 apps/server 门测试锁死)。两族 fp8/f16 都在 ⇒ f16 档不必绕门。
allowed_ops = [
        "cublas_gemm_bf16", "cublas_gemm_f16",
        "flashinfer_prefill_paged_f16", "flashinfer_prefill_paged_fp8kv", "gdn_chunked_delta_rule_fwd",
        "marlin_gemm_w4a16_awq", "marlin_gemm_w4a16_bf16",
        "owl_add_bf16", "owl_add_f16",
        "owl_argmax_f32idx_f16", "owl_cast_bf16_f16",
        # W4A8 档(2026-10-17;`[model] quant = "w4a8"` 时发射,否则白名单超集无害)
        "marlin_gemm_w4a8_awq", "owl_quant_int8_row_f16", "owl_ct_repack_a8_u32",
        "owl_cast_f16_bf16", "owl_concat_rows_f16",
        "owl_concat_rows_f32", "owl_ct_repack_u32",
        "owl_dflash_conv_bf16", "owl_dflash_select_bf16",
        "owl_embed_f16", "owl_fused_add_rmsnorm_bf16",
        "owl_fused_add_rmsnorm_f16", "owl_gdn_conv_fwd_f16",
        "owl_gdn_conv_upd_dual_f16", "owl_gdn_decode_step_v2_f16",
        "owl_gdn_gating_g_f16", "owl_gdn_l2norm_f16",
        "owl_gdn_norm_act_f16", "owl_gdn_recurrence_varlen_gqa_f16",
        "owl_gemv_dual_f16", "owl_naive_attn_nc_bf16_v2",
        "owl_narrow_strided_f16", "owl_norm_rope_bf16",
        "owl_norm_rope_f16", "owl_qknorm_rope_kv_insert_f16_fp8kv_knhd",
        "owl_qknorm_rope_kv_insert_f16_knhd",
        "owl_reshape_and_cache_fp8kv_knhd", "owl_rmsnorm_bf16",
        "owl_rmsnorm_f16", "owl_sigmoid_f16",
        "owl_sigmoid_gate_mul_f16", "owl_silu_and_mul_bf16",
        "owl_silu_and_mul_f16", "owl_topk16_merge_f16",
        "owl_topk16_split_f16",
        "owl_xqa_decode", "owl_xqa_prefill", "owl_xqa_verify",
        "vllm_chunked_prefill_paged_attn_opt_f16_knhd_hd256",
        "vllm_chunked_prefill_paged_attn_opt_fp8_knhd_hd256",
        "vllm_paged_attention_v2_f16_knhd_hd256bs32",
        "vllm_paged_attention_v2_fp8_knhd_hd256bs32",
        "vllm_paged_attention_v2_reduce_f16_hd256",
        "vllm_reshape_and_cache_bf16", "vllm_reshape_and_cache_f16_knhd",
]

[sampling]
mode = "greedy"
