# owl 引擎预设档 `tp27b-3080-262k`(2026-10-20)—— **2×RTX3080 20G:27B W4A16 · TP2 · 声明 262k**
#
# 定位:双 3080(20G×2)跑 Qwen3.8-27B AWQ-INT4(**W4A16**:权重 int4 / 激活 f16),
#   TP2 + **max_seq = 262144**(模型训练上限,不启用 YaRN)+ 本轮全部已验收性能刀。
#
# ── 每 rank 显存账(3080:19.63 GiB;本档 = **小设备池 + 宿主腿**,同 `awq27b-262k` 配方)──
#   权重 7.02 GB + int8 半表头 0.635 GB      ≈ 7.13 GiB
#   GDN 行/快照 + 图 slab + warmup/杂项      ≈ 1.63 GiB
#   chunk 512 激活面 + CUDA ctx              ≈ 1.2 GiB
#   **设备 KV 池 3 GiB**(98304 tok;工作集 + 常驻部分)
#   ── 小计 ≈ 13.0 GiB ⇒ boot 后实测 **free 5.4 GiB/卡**(两卡对称)
#   KV 每 rank 每 token = 16 层 × 2 × **2 头(TP2 切半)** × 256 维:
#       **fp8(e4m3)= 16 KiB/tok** ⇒ 262144 tok = **4 GiB**
#       fp16        = 32 KiB/tok ⇒ 262144 tok = 8 GiB(装置装不下 ⇒ 本档必须 fp8,
#                     `[dispatch].kv_fp8 = true`,白名单必须是**自洽的 fp8 池家族**)
#   非驻留 KV 走**宿主腿** 8 GiB(`host_cache_mb`)+ 虚拟化召回(`[kvmem]`)。
#
# ── 性能刀(全部本仓已验收,逐条出处)──
#   · `head_quant = rtn-int8-row`(P1.5-a;§72/§75)  头 1.27 → 0.635 GB/rank
#   · `tp_vocab_split = true`(P1.1;§76.4)          头再减半 ⇒ decode +3.4%
#   · `tp_ar_fused = true`(§11.2;§76.3)            AR 两核 → 一核 ⇒ decode +2.4%
#   · **fp8 KV**:长 ctx 解码时 KV 读量减半(262k 处 KV 读 ≈ 权重读的两倍)
#   · `prefill_chunk = 512`(**长 ctx 专用**):chunk 1024 的单 turn 瞬态账
#     实测 6 GiB(rank0),512 降到 ~3.5 GiB,256 只 ~1.8 GiB 但 prefill −9%
#     (4k 档实测 1523 vs 1597 t/s)⇒ 长 ctx 取 512。
#   · **不启用** `prefill_split`:本机 TP2 + 长 ctx 下实测**首请求挂死**(>180s 无 chunk);
#     关掉后同档立即正常 ⇒ 保持 false(重开需先查 FI split 的 TP 分片)。
#   · **不启用** `gdn_chunked`:AOT cubin 按 NV=48 烘死,TP2 的分片 NV=24 未重编
#     (§68 判定)⇒ 走 `gdn_recurrence_varlen_gqa`(§68 重写版,1.08 µs/tok)。
#
# ── 🔴 已知阻塞(**本档是"能力声明",不是"已验收生产档";2026-10-20 实测)──
#   设备块的**瞬态账每 turn 只增不还**(N4 未归还清单;与 8704 档 2.7k ctx 失败同一个根):
#     · 1k 级 turn:反复做**稳**(today 的 std A/B 就是 6 冷启 × 3 轮 × 1024 tok);
#     · ≥4k turn:rank0 **每 turn 掉 3.5 GiB**(rank1 只掉 ~0.7 GiB,rank 不对称),
#       第 2 个长 turn 必撞 `vram-hard-budget`(要求 2 KiB 也发不出)⇒ 该 turn 被丢弃并
#       留下 N4 未归还账(失败路径也不回收)。
#   ⇒ **持续长 ctx 服务被引擎侧这条账堵住**(待办 #7:失败/长 turn 的块必须归还 +
#      20 GB 卡的瞬态预算),不是本档参数能解的。解除后本档即可直接上生产。
#   ⇒ 今天要 262k × 稳定:先用 `tp27b`(1k 级,已验证 51.9 t/s @1024)或等 #7 落地。
#
# 实测读数(本档,3080 对):boot 装配 24.5 s;**boot 后 free 5458 / 5473 MiB(两卡对称)**;
#   1058 tok turn:decode **45.1 t/s**(虚拟化召回每步的税 ≈ 13%,对比纯常驻档 51.9);
#   4k turn(chunk 512、冷):prefill **1523 t/s**、decode **44.7 t/s**;
#   **第二个长 turn 必失败**(见上 🔴)。
#
# ── 若不需要长 ctx:纯常驻档(推荐今天就用这个)────────────────────────
#   把下面三处改掉即可(无召回、无宿主腿 ⇒ decode ~51.9 t/s、4k turn 可反复若干次):
#     [runtime] max_seq = 16384
#     [pool]    pool_tokens = 16384;prefix_cache = false;删掉 host_cache_mb/snap_host_mb
#     [kvmem]   整段删掉(不虚拟化)
#   16k × 16 KiB = 256 MiB 池 ⇒ boot 后 free ≈ 9.3 GiB/卡。
#
# ⚠️ 卡位不写本档 ⇒ 起档配站点文件带 `tp_ordinals`(本机 = [2, 3]);
#   端口 8146(8137= tp27b 默认;8142 曾撞别的会话)。
[model]
kind = "awq27b"
# **W4A16**:权重 AWQ-INT4(g32 asym)+ **激活 f16**(本档口径;W4A8 质量门未过档)
quant = "w4a16"
# **lm_head int8 per-row**(P1.5-a;2026-10-20 起本档默认):
#   装载期现算(`s_o = absmax/127`,q = RN-even(w/s)),头走
#   `owl_gemv_i8w_{f16,bf16}`(**只吃 m=1**:prefill 也在末行窄切后调用 ⇒ 同一核)。
#   判据:TP1 27B token 100%(344/344);TP2 词表切下 96.9%(744/768,唯一分歧
#   步 = 21.6094 vs 21.6094 的 near-tie,margin 1.6e-2);decode 22.43 → 21.47 ms/tok
#   (**−4.3%**,3080 对实测)。回退 = 删本行(缺省 off)或显式 `head_quant = "off"`。
head_quant = "rtn-int8-row"

[runtime]
# **TP 档选卡 = 显式双 ordinal**(v1;与 device / device_ordinal 互斥 ——
# 分片协议要"确定双卡 + 确定 rank 序",自动挑卡结果随占用漂移)。
# 启动日志 `[boot] 选卡(TP 档):rank0 = ordinal N → GPU-…` 是身份自证。
# ⚠️ 卡位**不写在本档**(每台机器的运行事实)⇒ 起本档必须再给一份运行文件
# 带 `tp_ordinals`(例:`testdata/args/bench-27b-tp2.toml`)。
# 测速几何(std 五点 512..8192 + 256 出 ⇒ 8448 够):与 awq27b 基准档同参
max_seq = 262144
prefill_chunk = 512
bind = "127.0.0.1:8146"
# **lm_head 词表切**(P1.1 2026-10-19;本档 2026-10-20 才真正打开 ——
# 此前它只在门/专项档里开过,**生产档一直是每 rank 全表头**)。
# 判据:`tp_vocab_split_gate` 27B 双卡全绿 —— 半表 124160 ×2 = 248320、
# 逐步 max|Δ| = **0.000000**(行独立 ⇒ 数值中性)、token 逐位相同(8 tok)。
# 收益(3080 对 @1024/256 ×3,两台冷启):decode 50.23 → **51.92(+3.4%)**。
tp_vocab_split = true
# **AR v1 两核融合**(§11.2;2026-10-19 就有,缺省关 ⇒ 生产一直在跑两核)。
# A/B(2 冷启 × 3 轮,6/6 配对全正):48.87 → **50.23(+2.4%)**;
# 0.8B `tp_g8_gate` 融合档 L1 逐位相同(v1=0 / fused=96)。
tp_ar_fused = true

[pool]
gdn_slots = 1
snap_max = 2
# 长 ctx 生产服务:**前缀缓存关** —— 池按 262k 全量给,prefix 占位会挤掉 KV
# (开了它 = 同 prompt 重复 prefill 更快,但本档的靶是"最长上下文 + 单流 decode")
# 虚拟化档要求 prefix_cache 为真(原地:缓存树 + 会话双持;boot 有硬校验)
prefix_cache = true
# **整池 = 全上下文**(常驻,无超卖;`[vram-gov]` 仍会按其实测 cap 夹)
# **设备池只留工作集**(262k 全量走宿主腿;与单卡 `awq27b-262k` 同一配方)
pool_tokens = 98304
# 20G 卡贴顶:留 512 MiB 守卫余量(缺省 1024 会白扔半 GiB 上下文)
vram_reserve_mb = 128
# **宿主双腿**(262k 的非驻留 KV 全落这;RAM ~108 GiB 富余)
host_cache_mb = 8192
snap_host_mb = 2048

[sampling]
# greedy = 恒等门口径(**测速档建议配 `--ignore-eos`**,否则随机词池
# OOD 输入下模型常几个 token 就停 ⇒ decode 读数成伪影)
mode = "greedy"

[server]
max_concurrency = 1

[dispatch]
# **KV e4m3 池**(262k 的唯一解,见卷首账)+ 长 ctx 的 prefill 分片。
# ⚠️ 池档位与白名单同族是**硬门**(`config.rs` 自洽门):fp8 池必须列 fp8 三件,
# 缺一个就在首发射处响亮拒。
kv_fp8 = true
prefill_split = false
#
# 白名单硬门按核名放行。本档 = **fp8 池族**(`awq27b-262k` 同族)+ f16/草稿/
# 通信族的**超集**(超集无害:未走的档不发射)。
#
# ⚠️ **本清单与 `awq27b` 的 KV/注意力族不同**:`awq27b` 的白名单是 **fp8 族**
# (`owl_qknorm_rope_kv_insert_f16_fp8kv_knhd` / `owl_reshape_and_cache_fp8kv_knhd` /
# `flashinfer_prefill_paged_fp8kv` / `vllm_paged_attention_v2_fp8_knhd_hd256bs32`),
# 而缺省 `kv_fp8 = false` 的 F16 族(kv-manifest 清单 `crates/models/src/kernel.rs`
# 的 `f16` 组)四项与之**同名不同物** ⇒ awq27b 档在 kv_fp8=false 下会在首次
# 发射处撞硬门(本档实测报 `owl_qknorm_rope_kv_insert_f16_knhd` 未准入)。
# 本档按 f16 族列全(下表即 F16 族六件:FI prefill / K0 写 / decode 融合插池 /
# chunked 读 / v2 读 / reduce)。
allowed_ops = [
        "cublas_gemm_f16",
        "marlin_gemm_w4a16_awq",
        # ---- W4A8 档(`model.w4a8 = true` 才实际发射;超集无害)----
        "marlin_gemm_w4a8_awq", "owl_quant_int8_row_f16", "owl_ct_repack_a8_u32",
        # ---- 草稿选择器/卷积族(P2.1-c)----
        "owl_dflash_conv_f16",
        "owl_dflash_select_f16",
        "owl_topk16_f16",
        "owl_topk16_merge_f16",
        "owl_topk16_split_f16",
        # ---- 草稿池族(P2.1-c;池写者/读者一致性门 E10 要求成套)----
        # ---- 草稿 BF16 全程(E5-DF3;草稿路径 BF16 全栈)----
        "vllm_reshape_and_cache_bf16",
        "vllm_reshape_and_cache_bf16_knhd",
        "owl_bias_add_bf16",
        "owl_comm_ar_1stage_bf16",
        # ---- v1 两核融合(§11.2;2026-10-19;runtime.tp_ar_fused 开时发射)----
        "owl_comm_ar_fused_f16",
        "owl_comm_ar_fused_bf16",
        "owl_comm_ar_reduce_bf16",
        "owl_comm_ar_reduce_f8_bf16",
        "owl_comm_ar_stage_bf16",
        "owl_comm_ar_stage_f8_bf16",
        "owl_dflash_conv_bf16",
        "owl_dflash_select_bf16",
        "owl_fused_add_rmsnorm_bf16",
        "owl_gelu_erf_bf16",
        "owl_gelu_tanh_bf16",
        "owl_layernorm_bf16",
        "owl_mul_bf16",
        "owl_naive_attn_nc_bf16",
        "owl_naive_attn_nc_bf16_v2",
        "owl_norm_rope_bf16",
        "owl_quant_int8_row_bf16",
        "owl_rmsnorm_bf16",
        "owl_silu_and_mul_bf16",
        # ---- 与单卡 `spec-dflash` 档的**并集**(P2.1-c;超集无害)----
        "cublas_gemm_bf16",
        "gdn_chunked_delta_rule_fwd",
        "marlin_gemm_w4a16_bf16",
        "owl_add_bf16",
        "owl_add_f16",
        "owl_argmax_f32idx_f16",
        "owl_cast_bf16_f16", "owl_cast_f16_bf16",
        # ---- **投机路径(P2.1-c;`[spec] tp_draft = true` 才实际发射;超集无害)** ----
        # 草稿(BF16 全程)+ verify 首轮拼接 + 草稿 GDN/attention 族:
        # 单卡 `spec-dflash` 档的同款条目 —— 双 rank 下这些核同样要过白名单。
        "cublas_gemm_bf16", "owl_add_bf16", "marlin_gemm_w4a16_bf16",
        "owl_concat_rows_f16", "owl_concat_rows_f32", "owl_cast_bf16_f16",
        # ---- AR fp8 载荷档(§47 第二步;`runtime.tp_ar_f8 = true` 才实际发射;超集无害)----
        "owl_comm_ar_stage_f8_f16", "owl_comm_ar_stage_f8_bf16",
        "owl_comm_ar_reduce_f8_f16", "owl_comm_ar_reduce_f8_bf16",
        "owl_add_f16",
        "owl_argmax_f32idx_f16", "owl_cast_bf16_f16",
        "owl_ct_repack_u32",
        "owl_embed_f16", "owl_fused_add_rmsnorm_f16",
        "owl_gdn_conv_fwd_f16", "owl_gdn_conv_upd_dual_f16",
        "owl_gdn_decode_step_v2_f16", "owl_gdn_gating_g_f16",
        "owl_gdn_l2norm_f16", "owl_gdn_norm_act_f16",
        "owl_gdn_recurrence_varlen_gqa_f16", "owl_gemv_dual_f16", "owl_gemv_i8w_bf16", "owl_gemv_i8w_f16",
        "owl_narrow_strided_f16", "owl_norm_rope_f16",
        # ⚠️ f16 写侧(`owl_qknorm_rope_kv_insert_f16_knhd` / `vllm_reshape_and_cache_f16_knhd`)
        # **不能**与 fp8 写者同列:E14「同一池实例的活跃写者布局唯一」会响亮拒启
        # (双寻址)。本档池 = fp8 ⇒ 写侧只留 fp8 族。
        "owl_rmsnorm_f16", "owl_sigmoid_f16",
        "owl_sigmoid_gate_mul_f16", "owl_silu_and_mul_f16",
        # ---- **fp8 池族**(kv_fp8 = true 时实际发射;与 f16 族同名不同物)----
        "owl_qknorm_rope_kv_insert_f16_fp8kv_knhd", "owl_reshape_and_cache_fp8kv_knhd",
        "flashinfer_prefill_paged_fp8kv", "vllm_chunked_prefill_paged_attn_opt_fp8_knhd_hd256",
        "vllm_paged_attention_v2_fp8_knhd_hd256bs32", "vllm_paged_attention_v2_reduce_f16_hd256",
        # ⚠️ f16 池**读者也不许留**:E10「读该池的算子 ≥1 个写者」—— 写侧去掉后
        # 读者变孤儿(实测拒启)。⇒ 白名单必须是**自洽的单一池家族**,
        # 不像通信/草稿族那样能用超集。
        "vllm_paged_attention_v2_reduce_f16_hd256",
        # ---- TP 通信族(仅双 rank 发射;单卡档不发 ⇒ 两白名单可共存)----
        "owl_comm_ar_stage_f16", "owl_comm_ar_reduce_f16",
]
