# owl 算子 tag 词表（唯一真源；build.rs 生成 KernelTag / KERNEL_TAGS / 位集）
#
# 纪律：
# - tag 是“选核/审计能力面”，不是算子名的一部分；
# - 分面命名空间（dom./quant./kv./phase./role./feat.），可前缀过滤；
# - `facet = "..."` 标记**互斥组**（同组单选；无该组 tag = 通用算子放行）；
# - 新增 tag 必须在这里登记；算子侧 #[kernel_tags(...)] 写错 = 编译期红
#   （宏按 id 生成 KernelTag::DOM_ATTN 这类关联常量）。
# - 每个生产算子至少 1 个 tag；全量覆盖由 ops::tests 机器锁。

