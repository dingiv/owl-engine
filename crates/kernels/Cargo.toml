[package]
name = "owl-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Operator dispatch + unified kernel home: .cu sources, nvrtc compile, raw-pointer launchers"

[features]
# 源码之家(sources)纯 include_str 零依赖 —— models 等上层引源不拖链接
# `log` = 诊断输出面编译门(2026-10-21):
#   - on(缺省):Rust 侧 `klog_*!` 展开为 `LogSink::logf`;build.rs 给 C++ 定义
#     `OWL_LOG_ENABLED`,`cu/owl_log.h` 的 `OWL_LOG_*` 生效;
#   - off:`klog_*!` **空展开**(实参不求值)+ C 宏 `((void)0)` ⇒ 两侧逐字节零成本。
# 运行期可见性另由 logger 的 level + tag 白黑名单控制(同一道 `LogSink::enabled`)。
"default" = ["log"]
"log" = []

# ── 构建期代际(目标 GPU 那一代:消费级 20/30/40/50 系)──────────────────
#
# 为什么是 feature 而不是环境变量:构建目标必须**进构建指纹**。env 不进 cargo
# 的缓存键 ⇒ “同一份源码 + 另一个 env”在 target/ 里不是一个东西,旧产物会
# 静默留用。feature 由 cargo 解析,天然进指纹、可复现、可被 `--features` 叠加。
#
# 选法:
#   cargo build --release -p server --no-default-features --features arch-sm120   # RTX 50 系
#   cargo build --release -p server --no-default-features --features arch-sm86,arch-sm120  # 双代际 fatbin
# 缺省(sm_86 = RTX 30 系)= `apps/server` 的 default;零 feature 的库构建落 `Arch::DEFAULT` + 告警。
# 多选语义:native cubin 出多代际 fatbin;单份 `.a` 家族(Marlin/FI/GDN)取**最高**代。
#
# 只收录用户裁决的四代(2026-10-27);数据中心卡/A100·H100·B200 不进具名表,
# 驱动报上来的表外代际落 `Arch::Other`(能力按 CC 推导,不冒充邻近代际)。
"arch-sm75" = []
"arch-sm86" = []
"arch-sm89" = []
# sm_120(50 系)顺带开 NVFP4 静态库:FP4 是 'a' 档指令,只有这一代有(见 `Caps::fp4_blockscale`)。
"arch-sm120" = ["nvfp4"]
# NVFP4 块缩放 GEMM(CUTLASS sm120 blockscaled mainloop → `libnvfp4.a`)。
# 源是 **arch-specific**:`-gencode arch=compute_120a,code=sm_120a`(两个都要带 `a`);
# 选中代没有 FP4 张量核时 build.rs 整段跳过。冷编 ≈ 25 s(CUTLASS 闭包单 TU)。
"nvfp4" = []
# cuBLAS 封装(f16 基线 F1;独立 feature —— 引源码之家不拖链接)
# half:W-2d 的 `gemm_f16_dst` 用 f16 标量(alpha/beta;CUBLAS_COMPUTE_16F 口径)
"cublas" = ["dep:cudarc", "dep:half"]
# Marlin W4A16(f16 激活 × u4 权重;build.rs nvcc/预编 .a + foreign-kernel)
"marlin" = ["dep:rayon", "dep:half"]
# FlashInfer prefill(预编 .a + foreign-kernel;E1.5 工作包)
"flashinfer" = []
# XQA(kNHD fp8 KV 的 decode/verify 注意力;移植自 vllm-ampere-optimized/flashampere;
# 预编 .a + foreign-kernel;2026-10-13 长 ctx verify 立案)
"xqa" = []
# 服务端面执行原语(device.rs:DeviceRes + Exec;纯 cudarc driver/nvrtc,
# 零 build.rs nvcc 面(旧 "cuda" feature 的 cuda_ops 预编链已退役删除,勿复活))
"device" = ["dep:cudarc"]

[dev-dependencies]
# GDN chunked cubin 金标对拍测试(测试域直用 cudarc;lib 零依赖律不破)
cudarc = { version = "0.19", default-features = false, features = [
    "std", "driver", "nvrtc", "cuda-version-from-build-system", "dynamic-loading",
] }
half = { version = "2.7.1" }
# 测试域设备解析(BDF→ordinal;唯一实现 = owl-cuda。dev 循环依赖允许)
owl-cuda = { path = "../backends/cuda" }
# 测试样板收编(#[owl_test(gpu)];同步体模式 —— 不建 runtime)
owl-macros = { path = "../macros" }

[dependencies]
# **全局日志/计量单一产地**(2026-10-29 用户裁决:对 kernels 开这个口子):
# kernels 直接用 `owl_shared::log_*!` / `metrics` —— 不再自带 sink 全局槽,
# C++ 侧 `OWL_LOG_*` 走 shared 提供的同一组 C ABI 符号(同一个全局 logger)。
owl-shared = { path = "../shared" }
# **接口层**(2026-10-29 反置):契约词汇(Dtype/Bytes/Arg/LaunchMsg/Arch/Hw/OpEnv)
# 与 LogSink 值类型住在 owl-iface —— 接口不依赖实现,实现依赖接口。
owl-iface = { path = "../backends/iface" }
# 算子 tag 注入属性宏(`#[kernel_tags]`;仅编译期,零运行期依赖)
owl-macros = { path = "../macros" }
# 官方 cudarc:仅 device/cublas feature 使用(Exec/家族发射;feature 化,
# A4 纪律:非后端 crate 引源码之家时不拖 CUDA 链接)
# nvrtc feature 仅为 Ptx 类型(load_module 入参;纯数据包装,零运行时编译)
cudarc = { version = "0.19", default-features = false, optional = true, features = [
    "std", "driver", "nvrtc", "cublas", "cuda-version-from-build-system", "dynamic-loading",
] }
# marlin repack(compressed-tensors → marlin 布局;weight_packed LSB-first)
rayon = { version = "1", optional = true }
half = { version = "2", optional = true }

[build-dependencies]
# tags.toml → KernelTag / KERNEL_TAGS 生成（构建期一次；不污染 lib 依赖面）
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1", features = ["derive"] }
