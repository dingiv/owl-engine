[package]
name = "owl-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative Tensor model layer: pure-functional forward over a lazy plan; defines the capability contract the CUDA server must satisfy"


[dev-dependencies]
# 样例的 async 运行时(CPU face 即测即用;GPU face 经 owl-cuda actor 消化阻塞)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# GPU 端到端样例的执行器(客户驱动 server;仅 dev —— 主依赖不含任何后端)
owl-cuda = { path = "../backends/cuda" }
