[package]
name = "owl-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative Tensor model layer: pure-functional forward over a lazy plan; defines the capability contract the CUDA server must satisfy"


[dependencies]
# 契约权威:线格式 + DeviceClient 能力契约(2026-09-25 下沉;后端不依赖前端)
owl-iface = { path = "../backends/iface" }
# kernel 源码之家(include_str 纯源,不拖 CUDA 链接 —— cudarc 已 feature 化)
owl-kernels = { path = "../kernels" }
# safetensors 权重源(loader.rs;F32/BF16 → host f32,量化另立)
safetensors = "0.8.0"
# mmap 只读映射(loader.rs)+ join_all 并发装载(interpreter.rs)
libc = "0.2"
futures-util = "0.3"
# tokenizer(tokenizer.rs;直接加载 tokenizer.json,纯 Rust)
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# f16 基线(F5):装载 bf16/f32 → f16 字节直转 + 层测试量化参考
# use-intrinsics:批量 slice 转换走 F16C(x86 运行时探测)—— 装载转
# 换段从 debug 标量 ~22MB/s 回到内存带宽级(2026-09-26 装载探针定谳:
# 转换段 45ms/MB 是装载慢的主因,非 DMA/非排队)
half = "2"
owl-f16c = { path = "../f16c" }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# 样例的 async 运行时(CPU face 即测即用;GPU face 经 owl-cuda actor 消化阻塞)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# CPU 后端(CpuFace:进程内同步直调,无 server)
owl-cpu = { path = "../backends/cpu" }
# GPU 端到端样例的执行器(客户驱动 server;仅 dev —— 主依赖不含任何后端)
owl-cuda = { path = "../backends/cuda" }
safetensors = "0.8.0"
