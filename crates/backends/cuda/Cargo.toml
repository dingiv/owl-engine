[package]
name = "owl-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA backend: cudarc wrapped with memory-safety governance (charter A1/A4)"

[features]
# CUPTI 进程内归因 shim(docs/arch/perf-framework.md §十一)。
# **缺省关**:不开则 build.rs 零动作、不编 shim、不引 libcupti(生产二进制
# 与之前逐字节等价);要"引擎自己分析自己"再加本 feature。
#   用法: cargo build --release -p server --features perf,cupti
#   运行时:/debug/perf/level/gpu 武装(level=gpu 才调 owl_cupti_start)
cupti = []

# 代际转发(单源在 owl-kernels;入口 `-p server --features arch-sm120` 一路透传)
# 消费级四代:20/30/40/50 系。多选 = 多代际 fatbin;单份 `.a` 家族取最高代。
arch-sm75 = ["owl-kernels/arch-sm75"]
arch-sm86 = ["owl-kernels/arch-sm86"]
arch-sm89 = ["owl-kernels/arch-sm89"]
arch-sm120 = ["owl-kernels/arch-sm120"]

[dependencies]
# 官方 crates.io 版(非 guoqingbao fork):图相关语义由本封装层自持,
# 不依赖 fork 的 graph feature(A4:语义分歧不进第三方库)
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "nvrtc",
    "cuda-version-from-build-system",
    "dynamic-loading",
] }
owl-iface = { path = "../iface" }
# 契约权威已下沉 owl-iface::contract(2026-09-25):后端不依赖前端
owl-kernels = { path = "../../kernels", features = ["cublas", "marlin", "flashinfer", "xqa", "device"] }
# GPU 逐核归因探针(OWL_GPU_PROF):动态 tag 入共享 metrics store
# (shared 零后端依赖,方向无环;server 与 engine 同进程线程,store 共享)
owl-shared = { path = "../../shared" }
parking_lot = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
half = { version = "2.7.1", features = ["use-intrinsics"] }
# 探针用:宿主层冷写的大页提示 A/B(`madvise(MADV_HUGEPAGE)`)
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# TP2 AR 门(G1/G2/G3):chunk 计划展开与 staging 布局的**单源**(comm 侧)
