[package]
name = "owl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestration layer: session slots + step loop + graph tri-state + memory governance"

[dependencies]
# 统一性能 metrics(直用 API:装载分相打点;宏零开销仅热路径)
owl-shared = { path = "../shared" }
# 唯一设备标准(iface contract:线格式/回执分级/顺序语义)
owl-iface = { path = "../backends/iface" }
# 声明式模型层(interpreters::eval_ops = 计算解释器)
owl-models = { path = "../models" }
# 图治理(A1:预算前置/生命周期律)—— M1 接线
owl-graph = { path = "../graph" }
# 绑定设备是引擎职责(models 主依赖零后端;engine 相反,见模块头)
owl-cuda = { path = "../backends/cuda" }
# 通信纯逻辑面(peer 分档 PeerPlan/staging 布局 StagingLayout;S4 ⑤-K2)
owl-comm = { path = "../backends/comm" }
half = "2"

[dev-dependencies]
# 重排面门(TP 装载:设备块 vs CPU marlin 参考)
owl-kernels = { path = "../kernels" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
owl-cpu = { path = "../backends/cpu" }
owl-macros = { path = "../macros" }

[features]
# 性能框架:release 也展开计时宏(见 workpace docs/arch/perf-framework.md)
perf = ["owl-shared/perf", "owl-models/perf"]
# logger 框架:不开时五级日志宏全是空语句(编译期剔除)
log = ["owl-shared/log", "owl-models/log"]

# E2E 场景面(docs/arch/test-architecture.md §三):集成测试经
# `--features e2e` 导入源文件里的场景函数;生产构建零改动(整块 cfg 剔除)。
e2e = []

# E2E 入口(docs/arch/test-architecture.md §二:每 crate 唯一 e2e 入口)。
# 文件名按约定带点(`<域>.e2e.rs`),而 cargo 目标名必须合法标识符 →
# 显式登记 path/name 两件套。
[[test]]
name = "engine_e2e"
path = "tests/engine.e2e.rs"
# 无 `e2e` feature 时**不构建**该目标(场景面由 feature 门控;
# 否则 `cargo test` 裸跑会因 lib 无 `tests` 模块而编译失败)
required-features = ["e2e"]
