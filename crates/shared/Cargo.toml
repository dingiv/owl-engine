[package]
name = "owl-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "共用基建:signal 依赖追踪(re-export)+ testkit 算子对拍框架 + metrics 计时刻度"

[dependencies]
# `LogSink` 的唯一定义处 = `owl-kernels::sink`(依赖倒置口);本 crate 经
# `owl-iface` 的 re-export 取类型,不新增对 kernels 的直接依赖。
# 后端无关的依赖追踪(signal 实体;iface 零后端契约,不拖 CUDA 链 ——
# models 依赖本 crate 的前提,2026-10-01 vestigial owl-cuda 依赖切除)
owl-iface = { path = "../backends/iface" }
# 配置文件面(owl.toml / flavor 预设;TOML = Cargo 同款,A4 治理:
# 纯 Rust 链 toml→toml_edit→winnow,零系统依赖)
serde = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# 单步/粘滞调试门(stepgate feature):等待必须是 async(不许阻塞运行时线程,
# 否则 HTTP 控制面回不了 step 信号 = 自锁)—— 见 src/stepgate.rs 模块头纪律 3。
# 不带 stepgate feature 时本依赖不编译(optional)。
tokio = { version = "1", optional = true, features = ["sync", "time"] }

[features]
# **默认开日志面**(2026-10-14 用户裁决):不开 feature 的 release 里
# 五级日志宏全是空语句 —— 默认构建要带日志,故入 default。
# 想要「编译期逐字节静默」的包:把依赖改成 default-features = false,
# 或运行时 [log] level = "off"。
default = ["log"]

# 性能框架(docs/arch/perf-framework.md):计时宏在 **release** 也可展开。
# 不带本 feature = 生产二进制逐字节零成本(宏仍只在 debug 展开);
# `cargo build --release -p server --features perf` = 基准二进制。
perf = []
# logger 框架(docs/arch/log-framework.md / log.rs 模块头):五级日志宏的
# 编译期门。**不开时五级全是空语句**(编译期剔除,零运行时)。
log = []

# **单步/粘滞调试门**(docs/arch/perf-framework.md §五 / stepgate.rs 模块头):
# 解释器检查点的编译期门。不带 = `step_gate!` 空展开(参数不求值、零开销);
# 带 = 可运行期切 off/sticky/single + tx/rx 外部 step 信号。
# 构建调试二进制:`cargo build --release -p server --features stepgate`
stepgate = ["dep:tokio"]

[dev-dependencies]
# stepgate 单测要 #[tokio::test](runtime + macros);不进生产依赖面
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
