[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "owl 引擎 SSE 服务架子(OpenAI 兼容 chat completions;engine actor 独占设备)"

[dependencies]
# 引擎面(构造/装载/submit_session/pump)
owl-engine = { path = "../../crates/engine" }
# 模型面:GGUF 起点族(模板自给 —— `tokenizer.chat_template` 在 .gguf 文件里;
# 2026-10-19 gguf 轮 REQ-GGUF-02)
owl-models = { path = "../../crates/models" }
# GPU 绑定(Engine::new 的 GpuClient 特化;actor 泛型界见 iface)
owl-cuda = { path = "../../crates/backends/cuda" }
owl-iface = { path = "../../crates/backends/iface" }
# 诊断:/debug/metrics 读 GPU 逐核归因分账(OWL_GPU_PROF 写入同进程 store)
owl-shared = { path = "../../crates/shared" }
# 诊断:/debug/vram —— store 三层账 + owner 维明细(第 0 刀;纯投影,不决策)
owl-store = { path = "../../crates/store" }
# 视觉塔输入契约(`VlmImage`)/图像预处理(png/jpeg)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# chat template 渲染(agent 服务面 §3.2/§7.1;HF transformers 语义兼容层)
hf-chat-template = { workspace = true }
# 手写 HTTP/1.1 + SSE(架子零重依赖;axum/hyper 迁移挂账,见 http.rs 模块头)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[features]
# **出代际（目标 GPU）** —— 只收消费级四代；缺省 = sm_86（RTX 30 系，可复现的基线档）。
# 换卡/换机只需换 feature（不是刷环境变量）：
#   cargo build --release -p server --no-default-features --features arch-sm120   # RTX 50 系
#   cargo build --release -p server --no-default-features --features arch-sm86,arch-sm120  # 双代际 fatbin
# 可选值：arch-sm75（RTX 20 系）/ arch-sm86（RTX 30 系）/ arch-sm89（RTX 40 系）/ arch-sm120（RTX 50 系）
"default" = ["arch-sm86"]
arch-sm75 = ["owl-cuda/arch-sm75"]
arch-sm86 = ["owl-cuda/arch-sm86"]
arch-sm89 = ["owl-cuda/arch-sm89"]
arch-sm120 = ["owl-cuda/arch-sm120"]
stepgate = ["owl-shared/stepgate"]

# 性能框架(docs/arch/perf-framework.md):带本 feature 的 release 构建里
# 计时宏/钩子全速采集;不带 = 生产二进制零成本。
#   用法: cargo build --release -p server --features perf
perf = ["owl-shared/perf", "owl-engine/perf"]
cupti = ["owl-cuda/cupti"]
log = ["owl-shared/log", "owl-engine/log"]

[dev-dependencies]
# e2e 骨架用 prctl(PR_SET_PDEATHSIG):父进程被 SIGKILL 时子 server 必须随之
# 退出(否则孤儿残留占端口+显存 → 后续整轮假绿;libc 已在 lock 内,零新增)
libc = "0.2"
