[project]
name = "owl-converter"
version = "0.1.0"
description = "Offline FP8/BF16 to 4bit converter for owl checkpoints"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
owl-convert = "owl_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl_converter"]

[dependency-groups]
dev = ["pytest>=8"]

# P2/P3 才会用到的重依赖；P0/P1 不安装。
# 版本锁进 uv.lock（见 docs/devlog/models/fp8-to-w4a16-converter.md 11.3）。
[project.optional-dependencies]
quant = [
    "llmcompressor==0.15.0",
    "torch>=2.10,<2.16",
    "transformers>=5.15,<5.22",
]
