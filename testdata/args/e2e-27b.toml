# e2e 黑盒测试 server 配置(apps/server/tests/e2e.rs 用 include_str! 读)
#
# 由 e2e.rs 在运行时写到 $TMPDIR/owl-e2e-server.toml,再以
#   server -p profiles/qwen38_27b-3090-w4a16-dflash.toml <该文件>
# 拉起(端口 8135,设备 CUDA ordinal 1 = 3090 Ti)。
#
# 口径来由(§三十三):8448/8704 + prefill_split = 数学 gate 判据干净的配置
# (nb/max_seq 边界已定谳;池 8704 = 272 页 × 32 tok)。
#
# ⚠️ 路径为本机资产(workspace models/ 下),换机需改。

[server]
# 必须与 apps/server/tests/e2e.rs 的 PORT 同源：否则继承 full.toml 的 8137，
# 会被生产/调试 server 占用而误报 AddrInUse。
bind = "127.0.0.1:8135"

[model]
path = "../../models/cyankiwi/Qwen3.8-27B-AWQ-INT4"
name = "qwen3.8-27b"

[runtime]
# 2026-10-16 回归复跑:旧写法 `device = 1`(整数)在新 schema(DeviceSpec 表)
# 下反序列化即拒启(P0-2 同族);测试资产改显式 ordinal,指向空闲卡(本 boot CUDA0=41:00)
# (原 [runtime] device_ordinal 已迁 [parallel] device)
max_seq = 8448

[pool]
gdn_slots = 8

[kernel]
prefill_split = true

[spec]
draft_path = "../../models/syvai/Qwen3.8-27B-DFlash2-W4A16"

[parallel]
device = []   # 原 device_ordinal = 0(CUDA 序号禁用;钉卡请写 BDF/UUID/名字)
