# 长 ctx 阶梯档 —— 扫到 32768,故几何放大到 40960/41216(生产 16384/16896);
# 行为面全取 flavor `spec-dflash`。
#
# 继承本地站点档 `base.toml`(未入库;内容即下面注释块,按机器改路径):
#   [model] kind="awq27b" / dir=<…>/Qwen3.8-27B-AWQ-INT4
#           dflash2_dir=<…>/Qwen3.8-27B-DFlash2-W4A16 / name="qwen3.8-27b"
#   [runtime] bind="127.0.0.1:8138"
#
# 启动: CUDA_VISIBLE_DEVICES=<3090 Ti UUID> ./target/release/server \
#         --flavor spec-dflash testdata/args/perf-ctxladder-27b.toml \
#         --log-level info [--perf-level gpu]
# 发射账(只在做宿主命令账时显式加回,缺省不开):[cuda] trace_ring = 65536

extends = "base.toml"

[runtime]
max_seq = 40960

[pool]
pool_tokens = 41216
